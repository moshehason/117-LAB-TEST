if(n<threshold)discard;float tip=1.-layer;vec3 root=vec3(.075,.068,.064);vec3 grey=vec3(.28,.265,.25);vec3 silver=vec3(.62,.59,.55);vec3 col=mix(root,grey,smoothstep(.05,.65,layer));col=mix(col,silver,smoothstep(.72,1.,layer)*smoothstep(.7,1.,n));float li=.48+.52*max(dot(normalize(N),normalize(vec3(-.3,.65,.7))),0.);gl_FragColor=vec4(col*li,mix(.96,.62,layer));}`;const tex=new THREE.TextureLoader().load('https://raw.githubusercontent.com/piellardj/fur-threejs/main/docs/resources/textures/noise.png');tex.wrapS=tex.wrapT=THREE.RepeatWrapping;new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json',font=>{const geo=new TextGeometry('117',{font,size:2.8,depth:1.0,curveSegments:14,bevelEnabled:true,bevelThickness:.13,bevelSize:.09,bevelSegments:7});geo.computeBoundingBox();const b=geo.boundingBox;geo.translate(-(b.max.x+b.min.x)/2,-(b.max.y+b.min.y)/2,0);G.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x171514,roughness:1})));for(let i=1;i<=42;i++){const u=i/42,mat=new THREE.ShaderMaterial({vertexShader:V,fragmentShader:F,uniforms:{layer:{value:u},time:{value:0},noiseTex:{value:tex}},transparent:true,depthWrite:i<24,side:THREE.DoubleSide});fur.push(mat);G.add(new THREE.Mesh(geo,mat))}});let drag=false,last=0,target=0,rot=0;R.domElement.onpointerdown=e=>{drag=true;last=e.clientX};R.domElement.onpointermove=e=>{if(drag){target+=(e.clientX-last)*.004;target=Math.max(-.72,Math.min(.72,target));last=e.clientX}};onpointerup=()=>drag=false;const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const t=clock.getElapsedTime();fur.forEach(m=>m.uniforms.time.value=t);rot+=(target-rot)*.06;G.rotation.y=rot+Math.sin(t*.28)*.08;G.position.y=Math.sin(t*.55)*.07;R.render(S,C)}frame();onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}</script></body></html>
