function pig(px,py,S,kind,t,p){x.save();x.translate(px,py);let lean=kind===7?-.18:0;x.transform(1,0,lean,1,0,0);let pulse=1+.025*Math.sin(t*1.7+p);x.scale(S*pulse,S/pulse);

let g=x.createLinearGradient(-.4,-.5,.4,.5);g.addColorStop(0,'#ffed00');g.addColorStop(.22,'#ff36bc');g.addColorStop(.48,'#28e7d4');g.addColorStop(.7,'#111');g.addColorStop(1,'#159de0');x.fillStyle=g;x.fill();x.strokeStyle='#050505';x.lineWidth=.025;x.stroke();x.clip();

x.beginPath();x.moveTo(-.18,-.48);x.lineTo(-.27,-.67);x.lineTo(-.04,-.52);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(.17,-.48);x.lineTo(.27,-.67);x.lineTo(.05,-.52);x.closePath();x.fill();x.stroke();
x.fillStyle='#0a0a0a';x.fillRect(-.13,-.39,.065,.055);x.fillRect(.065,-.39,.065,.055);x.fillStyle='#ff9dcb';x.fillRect(-.11,-.29,.22,.09);x.strokeRect(-.11,-.29,.22,.09);x.fillStyle='#111';x.fillRect(-.065,-.265,.022,.035);x.fillRect(.045,-.265,.022,.035);
// mouth + blue digital torrent

for(let i=0;i<17;i++){let xx=-.115+i*.014+Math.sin(t*4+i)*.008,hh=.28+.24*(.5+.5*Math.sin(t*2+i*1.7+p));x.fillStyle=i%3?'#73dfff':'#d9f8ff';x.fillRect(xx,-.07,.012,hh)}
// RGB fragment noise

function F(ms){let t=ms*.001;x.setTransform(d,0,0,d,0,0);x.fillStyle='#fff';x.fillRect(0,0,w,h);let S=Math.min(w,h)*.48,cx=w*.425,cy=h*.50,g=S*.47;

function pigSound(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=window.__pigAC||(window.__pigAC=new A());if(ac.state==='suspended')ac.resume();const now=ac.currentTime,g=ac.createGain(),o=ac.createOscillator(),o2=ac.createOscillator();g.connect(ac.destination);o.connect(g);o2.connect(g);o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(165,now);o.frequency.exponentialRampToValueAtTime(92,now+.22);o2.frequency.setValueAtTime(78,now);o2.frequency.exponentialRampToValueAtTime(54,now+.22);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+.28);o.start(now);o2.start(now);o.stop(now+.3);o2.stop(now+.3)}
