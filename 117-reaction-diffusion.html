<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>117 BIO GROWTH</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:100%;height:100%;display:block}.tag{position:fixed;left:14px;bottom:12px;font:10px Arial;letter-spacing:.18em;color:#1118;z-index:2}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),gl=c.getContext('webgl',{antialias:false,alpha:true,premultipliedAlpha:false});
const vs='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const sim=`precision highp float;varying vec2 v;uniform sampler2D s;uniform vec2 px;uniform float t;uniform vec2 touch;
vec2 q(vec2 u){return texture2D(s,u).rg;}void main(){vec2 z=q(v),n=q(v+vec2(0.,px.y)),so=q(v-vec2(0.,px.y)),e=q(v+vec2(px.x,0.)),w=q(v-vec2(px.x,0.));vec2 L=n+so+e+w-4.*z;float A=z.x,B=z.y;float f=.0367+.003*sin(t*.09),k=.0649+.002*cos(t*.07);float r=A*B*B;A+=.92*L.x-r+f*(1.-A);B+=.46*L.y+r-(k+f)*B;float d=distance(v,touch);B+=.24*smoothstep(.045,0.,d);gl_FragColor=vec4(clamp(A,0.,1.),clamp(B,0.,1.),0.,1.);}`;
const out=`precision highp float;varying vec2 v;uniform sampler2D s;uniform vec2 res;uniform float t;
float line(vec2 p,vec2 a,vec2 b,float r){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return smoothstep(r,r*.45,length(pa-ba*h));}
void main(){vec2 p=v;float g=0.;g=max(g,line(p,vec2(.29,.25),vec2(.29,.76),.060));g=max(g,line(p,vec2(.47,.25),vec2(.47,.76),.060));g=max(g,line(p,vec2(.61,.75),vec2(.79,.75),.060));g=max(g,line(p,vec2(.79,.75),vec2(.66,.25),.060));vec2 z=texture2D(s,v).rg;float bio=z.y;float cells=smoothstep(.13,.62,bio)*g;float edge=smoothstep(.015,.055,g)-smoothstep(.055,.085,g);float pulse=.5+.5*sin(t*.35+bio*8.);float membrane=smoothstep(.08,.48,bio)*g;
float vein=smoothstep(.30,.70,bio)*(1.-smoothstep(.72,.92,bio))*g;
float glint=pow(clamp(.5+.5*sin(bio*34.+p.x*19.-t*.7),0.,1.),12.)*g;
float ripple=.5+.5*sin(bio*28.+p.y*13.+t*.32);
float skin=g*(.20+.48*membrane);
vec3 pearl=mix(vec3(.10,.78,.72),vec3(.72,.18,.92),ripple);
vec3 col=pearl*.28;
col+=vec3(1.0)*glint*1.8;
col+=vec3(.10,.55,.72)*edge*.55;
float holes=smoothstep(.64,.88,bio)*g;
skin*=1.-holes*.82;gl_FragColor=vec4(col,clamp(skin+glint*.55+edge*.18,0.,.86));}`;
function sh(type,src){let x=gl.createShader(type);gl.shaderSource(x,src);gl.compileShader(x);return x}function pr(fs){let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);return p}
const ps=pr(sim),po=pr(out),b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
let tex=[],fb=[];for(let i=0;i<2;i++){tex[i]=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex[i]);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);fb[i]=gl.createFramebuffer();}
let W=0,H=0,ix=0,touch=[.5,.5];addEventListener('pointermove',e=>touch=[e.clientX/innerWidth,1-e.clientY/innerHeight]);
function resize(){let d=Math.min(devicePixelRatio,2);c.width=innerWidth*d;c.height=innerHeight*d;W=Math.min(700,c.width);H=Math.min(900,c.height);for(let i=0;i<2;i++){gl.bindTexture(gl.TEXTURE_2D,tex[i]);let a=new Uint8Array(W*H*4);for(let j=0;j<W*H;j++){a[j*4]=255;a[j*4+1]=(Math.random()<.004?220:0);a[j*4+3]=255}gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,a);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[i]);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex[i],0)}}resize();addEventListener('resize',resize);
function quad(P){let l=gl.getAttribLocation(P,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0)}
function frame(ms){let T=ms*.001;for(let j=0;j<5;j++){let ni=1-ix;gl.bindFramebuffer(gl.FRAMEBUFFER,fb[ni]);gl.viewport(0,0,W,H);gl.useProgram(ps);quad(ps);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[ix]);gl.uniform1i(gl.getUniformLocation(ps,'s'),0);gl.uniform2f(gl.getUniformLocation(ps,'px'),1/W,1/H);gl.uniform1f(gl.getUniformLocation(ps,'t'),T);gl.uniform2f(gl.getUniformLocation(ps,'touch'),touch[0],touch[1]);gl.drawArrays(gl.TRIANGLES,0,3);ix=ni}gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,c.width,c.height);gl.useProgram(po);quad(po);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[ix]);gl.uniform1i(gl.getUniformLocation(po,'s'),0);gl.uniform2f(gl.getUniformLocation(po,'res'),c.width,c.height);gl.uniform1f(gl.getUniformLocation(po,'t'),T);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
