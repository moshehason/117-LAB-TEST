<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 TIME CUT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{width:100%;height:100%;display:block;touch-action:none}.tag{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));font:700 10px monospace;letter-spacing:.12em;color:#111;mix-blend-mode:difference;z-index:2}</style></head><body><canvas id=c></canvas><div class=tag>117 / TIME AS MATERIAL</div><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,D=Math.min(devicePixelRatio||1,2),t=0,mx=.5,my=.5,base=null,tiltX=0,tiltY=0;
const N=54,frames=[],off=document.createElement('canvas'),o=off.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);off.width=Math.max(180,Math.floor(W/3));off.height=Math.max(260,Math.floor(H/3))}resize();onresize=resize;
function source(tt){let w=off.width,h=off.height;o.fillStyle='#eeeae4';o.fillRect(0,0,w,h);let q=tt*.001;
for(let i=0;i<14;i++){let yy=h*(.08+i*.065),xx=w*(.5+Math.sin(q*.7+i*.71)*.28);o.fillStyle=['#050505','#00d9ff','#ff2d86','#6bff5b','#5b4dff'][i%5];o.fillRect(xx-w*.24,yy,w*(.30+.12*Math.sin(q+i)),Math.max(3,h*.018));}
o.save();o.translate(w/2,h/2);o.rotate(Math.sin(q*.37)*.18);o.textAlign='center';o.textBaseline='middle';o.font='900 '+Math.min(w*.48,h*.24)+'px Arial Black,Impact';o.fillStyle='#050505';o.fillText('117',Math.sin(q)*w*.08,Math.cos(q*.8)*h*.05);o.restore();
for(let i=0;i<7;i++){o.strokeStyle=['#ff2d86','#00d9ff','#111'][i%3];o.lineWidth=2+i%2;o.beginPath();let xx=w*(.1+i*.14+Math.sin(q+i)*.03);o.moveTo(xx,0);o.bezierCurveTo(xx+w*.2*Math.sin(q+i),h*.3,xx-w*.2,h*.7,xx,h);o.stroke()}}
function capture(tt){source(tt);frames.unshift(o.getImageData(0,0,off.width,off.height));if(frames.length>N)frames.pop()}
function draw(tt){t=tt;capture(tt);x.fillStyle='#f4f1eb';x.fillRect(0,0,W,H);if(frames.length<2){requestAnimationFrame(draw);return}
let bands=Math.min(90,Math.floor(H/6)),bh=H/bands,sw=off.width,sh=off.height;
for(let i=0;i<bands;i++){let yn=i/(bands-1),wave=Math.sin(yn*18+tt*.0017)*.5+.5,depth=Math.floor((wave*.48+mx*.34+tiltX*.18)*(frames.length-1));depth=Math.max(0,Math.min(frames.length-1,depth));let im=frames[depth];if(!im)continue;let sy=Math.max(0,Math.min(sh-1,Math.floor(yn*(sh-1))));let push=(depth/Math.max(1,N-1)-.5)*W*.34+Math.sin(yn*31+tt*.002)*W*.035,scale=1+depth/Math.max(1,N-1)*.34;
x.save();x.beginPath();x.rect(0,i*bh,W,bh+1);x.clip();let tmp=document.createElement('canvas');tmp.width=sw;tmp.height=sh;tmp.getContext('2d').putImageData(im,0,0);x.drawImage(tmp,0,sy,sw,Math.max(1,Math.ceil(sh/bands)),-W*(scale-1)/2+push,i*bh,W*scale,bh+2);x.restore()}
x.save();x.globalCompositeOperation='difference';x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='900 '+Math.min(W*.32,H*.22)+'px Arial Black,Impact';x.fillText('117',W/2,H/2);x.restore();requestAnimationFrame(draw)}
function point(e){mx=e.clientX/W;my=e.clientY/H}c.onpointermove=point;c.onpointerdown=point;
function orient(e){if(e.gamma==null)return;if(base===null)base=e.gamma;tiltX=Math.max(-1,Math.min(1,(e.gamma-base)/28))}
if(sessionStorage.getItem('117tilt')==='1'||typeof DeviceOrientationEvent==='undefined'||typeof DeviceOrientationEvent.requestPermission!=='function')addEventListener('deviceorientation',orient,true);
requestAnimationFrame(draw);
</script></body></html>
