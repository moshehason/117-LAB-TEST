function loop(n){requestAnimationFrame(loop);let t=(n-start)/1000,z=t<16?5-E(0,16,t)*78:-73-E(16,19,t)*5.5,b=Math.sin(z*.12)*1.1;c.position.set(c.position.x+(b+tilt*.35+drag-c.position.x)*.05,1.65+Math.sin(t*8)*.022,z);c.rotation.y+=(-Math.sin(z*.12)*.12-tilt*.06-drag*.2-c.rotation.y)*.05;if(t>16){let q=E(16,18,t);dl.position.x=-1.6-q*2.7;dr.position.x=1.6+q*2.7}if(t>18){fire117.visible=altar.visible=true}fireUniforms.time.value=t;if(fire117.visible){fireLight.intensity=13+Math.sin(t*9)*2.5+Math.random()*1.5;sparks.forEach((m,i)=>{let u=(t*m.userData.s+i*.071)%1;m.position.set(m.userData.x+Math.sin(t*3+i)*.08,m.userData.y+u*2.5,Math.sin(i)*.12);m.scale.setScalar(1-u*.75)})}if(t>=blackoutAt){blackoutUntil=t+.75+Math.random()*.35;blackoutAt=t+6.5+Math.random()}if(t>=nextFlicker){slowFlicker=t+.18+Math.random()*.45;nextFlicker=t+3+Math.random()*5.5}const dark=t<blackoutUntil;corridorLights.forEach(L=>L.intensity=dark?0:(t<slowFlicker?6+Math.random()*8:25));s.children.filter(o=>o.isHemisphereLight).forEach(L=>L.intensity=dark?0:1.05);if(t>28)document.querySelector('#fade').style.opacity=E(28,29.5,t);if(t>30.5){start=n;dl.position.x=-1.6;dr.position.x=1.6;fire117.visible=altar.visible=false;fireLight.intensity=0;document.querySelector('#fade').style.opacity=0}r.render(s,c)}
