<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 SOFTBODY</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;touch-action:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from 'three';import{FontLoader}from'three/addons/loaders/FontLoader.js';import{TextGeometry}from'three/addons/geometries/TextGeometry.js';
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.setClearColor(0,0);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.92;document.body.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);C.position.set(0,0,9);S.add(new THREE.HemisphereLight(0xffffff,0x050505,1.35));let L=new THREE.DirectionalLight(0xffffff,10);L.position.set(3,5,6);S.add(L);let P=new THREE.PointLight(0x88bbff,28,20);P.position.set(-4,1,4);S.add(P);
let mesh,base,vel,pointer={x:0,y:0,down:false};new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json',font=>{let g=new TextGeometry('117',{font,size:2.35,depth:.72,curveSegments:18,bevelEnabled:true,bevelThickness:.22,bevelSize:.13,bevelSegments:8});g.computeBoundingBox();let b=g.boundingBox;g.translate(-(b.min.x+b.max.x)/2,-(b.min.y+b.max.y)/2,-(b.min.z+b.max.z)/2);base=new Float32Array(g.attributes.position.array);vel=new Float32Array(base.length);let m=new THREE.MeshPhysicalMaterial({color:0x8d9298,roughness:.13,metalness:.12,clearcoat:1,clearcoatRoughness:.035,transmission:.06,thickness:1.2,ior:1.42});mesh=new THREE.Mesh(g,m);mesh.scale.setScalar(.437);mesh.position.set(0,0,0);S.add(mesh);
});
function disturb(x,y){if(!mesh)return;let a=mesh.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){let dx=base[i]-x*3.2,dy=base[i+1]-y*2.1,d=Math.sqrt(dx*dx+dy*dy);if(d<1.25){let q=(1-d/1.25);vel[i]+=dx*q*.055;vel[i+1]+=dy*q*.055;vel[i+2]+=q*.18}}}
addEventListener('pointerdown',e=>{pointer.down=true;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight*2-1);disturb(pointer.x,pointer.y)});addEventListener('pointermove',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight*2-1);if(pointer.down)disturb(pointer.x,pointer.y)});addEventListener('pointerup',()=>pointer.down=false);
let clock=new THREE.Clock();function loop(){let t=clock.getElapsedTime();if(mesh){let a=mesh.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){let bx=base[i],by=base[i+1],bz=base[i+2];let breathe=1+.055*Math.sin(t*1.35+by*.8);let tx=bx*breathe,ty=by*(1+.045*Math.sin(t*1.18+bx)),tz=bz+.10*Math.sin(t*1.5+bx*1.4+by*.8);vel[i]+=(tx-a[i])*.018;vel[i+1]+=(ty-a[i+1])*.018;vel[i+2]+=(tz-a[i+2])*.018;vel[i]*=.92;vel[i+1]*=.92;vel[i+2]*=.92;a[i]+=vel[i];a[i+1]+=vel[i+1];a[i+2]+=vel[i+2]}mesh.geometry.attributes.position.needsUpdate=true;mesh.geometry.computeVertexNormals();mesh.rotation.y=.14*Math.sin(t*.34);mesh.rotation.x=.055*Math.sin(t*.27)}R.render(S,C);requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
