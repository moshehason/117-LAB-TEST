<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 BIO SOFTBODY</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;touch-action:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from'three';import{FontLoader}from'three/addons/loaders/FontLoader.js';import{TextGeometry}from'three/addons/geometries/TextGeometry.js';
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.setClearColor(0,0);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;document.body.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);C.position.z=9;S.add(new THREE.HemisphereLight(0xffffff,0x160820,3));let dl=new THREE.DirectionalLight(0xffffff,5);dl.position.set(3,5,6);S.add(dl);let violet=new THREE.PointLight(0x8d35ff,30,16);violet.position.set(-3,1,4);S.add(violet);let cyan=new THREE.PointLight(0x31d7ff,24,16);cyan.position.set(3,-1,4);S.add(cyan);
const G=new THREE.Group();S.add(G);let body;
const wormMat=new THREE.MeshPhysicalMaterial({color:0x18a9a0,roughness:.28,clearcoat:1,clearcoatRoughness:.08,transmission:.16,thickness:.6,emissive:0x062b35,emissiveIntensity:.28});
const tardMat=new THREE.MeshPhysicalMaterial({color:0xff78b8,roughness:.32,clearcoat:1,clearcoatRoughness:.08,transmission:.22,thickness:.9,emissive:0x6a075e,emissiveIntensity:.32});
const glowMat=new THREE.MeshPhysicalMaterial({color:0x9c48ff,roughness:.16,clearcoat:1,emissive:0x6b16ff,emissiveIntensity:1.15});
function worm(x,y,z,len=.55){let g=new THREE.Group();for(let i=0;i<7;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(.10-i*.004,12,9),wormMat);q.position.x=(i-3)*len/6;q.scale.set(1.15,.72,.72);g.add(q)}g.position.set(x,y,z);g.rotation.z=Math.random()*6.28;G.add(g);return g}
function tard(x,y,z,s=.18){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),tardMat);b.scale.set(1.25,.72,.72);g.add(b);for(let i=0;i<4;i++)for(let side of[-1,1]){let leg=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),tardMat);leg.position.set((i-1.5)*.48,side*.62,0);leg.scale.set(.55,1.1,.55);g.add(leg)}g.scale.setScalar(s);g.position.set(x,y,z);G.add(g);return g}
let critters=[];new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json',font=>{let geo=new TextGeometry('117',{font,size:2.25,depth:.65,curveSegments:14,bevelEnabled:true,bevelThickness:.18,bevelSize:.12,bevelSegments:7});geo.computeBoundingBox();let b=geo.boundingBox;geo.translate(-(b.min.x+b.max.x)/2,-(b.min.y+b.max.y)/2,-.3);body=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:0x30134f,roughness:.22,clearcoat:1,clearcoatRoughness:.08,transmission:.08,emissive:0x5518a5,emissiveIntensity:.42}));body.scale.setScalar(.68);G.add(body);
for(let i=0;i<28;i++)critters.push(worm((Math.random()-.5)*3.4,(Math.random()-.5)*1.7,.52+Math.random()*.28,.38+Math.random()*.48));
for(let i=0;i<13;i++)critters.push(tard((Math.random()-.5)*3.2,(Math.random()-.5)*1.6,.72+Math.random()*.2,.13+Math.random()*.07));
for(let i=0;i<16;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.045,10,8),glowMat);q.position.set((Math.random()-.5)*3.3,(Math.random()-.5)*1.7,.8);G.add(q);critters.push(q)}
});
let clock=new THREE.Clock();function loop(){let t=clock.getElapsedTime();G.rotation.y=.14*Math.sin(t*.28);G.rotation.x=.045*Math.sin(t*.21);if(body){body.scale.x=.68*(1+.035*Math.sin(t*1.15));body.scale.y=.68*(1+.045*Math.sin(t*.92));}critters.forEach((o,i)=>{o.rotation.z+=.0025*Math.sin(t*.7+i);o.position.x+=.0015*Math.sin(t*.83+i*1.7);o.position.y+=.0012*Math.cos(t*.69+i*.91);let s=1+.08*Math.sin(t*1.5+i);o.scale.z=s});R.render(S,C);requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
