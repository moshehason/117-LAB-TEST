<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — VOYAGE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .ui{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));
  }
  .tag{font:700 9px/1 Arial,sans-serif;letter-spacing:.2em;color:rgba(180,220,255,.45)}
  .status{
    font:700 11px/1.4 Arial,sans-serif;letter-spacing:.12em;
    color:rgba(200,230,255,.7);text-align:center;
  }
  .hint{font:700 9px/1 Arial,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.35);text-align:right}
</style>
<style id="117-transparent-bg">html,body{background:transparent!important;background-color:transparent!important}canvas{background:transparent!important}</style></head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="tag">117 / VOYAGE</div>
  <div class="status" id="status">APPROACHING VORTEX</div>
  <div class="hint">HOLD TO ACCELERATE</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
let W, H, D, time = 0;
let speed = 1;
let targetSpeed = 1;
let progress = 0; // 0 → 1 journey
let stars = [];
let galaxies = [];
let particles = [];

const PHASES = [
  { at: 0.00, text: 'APPROACHING VORTEX' },
  { at: 0.15, text: 'ENTERING 117 FIELD' },
  { at: 0.35, text: 'CROSSING GALAXIES' },
  { at: 0.55, text: 'WARP TUNNEL' },
  { at: 0.75, text: 'PLANETARY APPROACH' },
  { at: 0.90, text: 'NEW WORLD AHEAD' }
];

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  initStars();
}
resize();
addEventListener('resize', resize);

function initStars() {
  stars = [];
  for (let i = 0; i < 420; i++) {
    stars.push({
      x: (Math.random() - 0.5) * 4,
      y: (Math.random() - 0.5) * 4,
      z: Math.random() * 2,
      size: 0.4 + Math.random() * 1.6,
      hue: 200 + Math.random() * 80
    });
  }
  galaxies = [];
  for (let i = 0; i < 7; i++) {
    galaxies.push({
      angle: Math.random() * Math.PI * 2,
      dist: 0.3 + Math.random() * 0.9,
      size: 40 + Math.random() * 90,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.01,
      hue: 180 + Math.random() * 120
    });
  }
}

let pointerDown = false;
canvas.addEventListener('pointerdown', () => { pointerDown = true; targetSpeed = 3.8; });
canvas.addEventListener('pointerup', () => { pointerDown = false; targetSpeed = 1; });
canvas.addEventListener('pointerleave', () => { pointerDown = false; targetSpeed = 1; });
canvas.addEventListener('touchstart', () => { pointerDown = true; targetSpeed = 3.8; }, {passive:true});
canvas.addEventListener('touchend', () => { pointerDown = false; targetSpeed = 1; });

function drawGalaxy(g, cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(g.rot);
  const s = g.size * scale * D;

  // Soft glow disk
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, s);
  grad.addColorStop(0, `hsla(${g.hue}, 90%, 75%, 0.35)`);
  grad.addColorStop(0.4, `hsla(${g.hue + 30}, 80%, 50%, 0.15)`);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, s, 0, Math.PI * 2);
  ctx.fill();

  // Spiral arms (simple)
  ctx.strokeStyle = `hsla(${g.hue}, 70%, 70%, 0.25)`;
  ctx.lineWidth = 1.5 * D;
  for (let arm = 0; arm < 3; arm++) {
    ctx.beginPath();
    for (let t = 0; t < 12; t++) {
      const a = arm * 2.1 + t * 0.45 + g.rot * 0.5;
      const r = (t / 12) * s * 0.9;
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r * 0.55;
      if (t === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - (frame.last || ms)) / 1000);
  frame.last = ms;
  time = ms * 0.001;

  // Speed & progress
  speed += (targetSpeed - speed) * 0.04;
  progress += speed * 0.0032 * (pointerDown ? 1.4 : 1);
  if (progress > 1) progress = progress % 1; // loop the journey

  // Update status text
  let phaseText = PHASES[0].text;
  for (const p of PHASES) if (progress >= p.at) phaseText = p.text;
  statusEl.textContent = phaseText;

  // Background depth color shifts with progress
  const deep = 4 + progress * 12;
  ctx.fillStyle = `rgb(${deep},${deep * 0.6},${deep * 1.4})`;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;

  // —— Stars flying toward / into vortex ——
  for (const s of stars) {
    s.z -= 0.012 * speed;
    if (s.z <= 0.01) {
      s.z = 1.8 + Math.random();
      s.x = (Math.random() - 0.5) * 4;
      s.y = (Math.random() - 0.5) * 4;
    }

    // Vortex swirl stronger in middle progress
    const swirl = progress * 1.8;
    const ang = Math.atan2(s.y, s.x) + swirl * (1.2 - s.z) * 0.04 * speed;
    const dist = Math.sqrt(s.x * s.x + s.y * s.y);
    const sx = Math.cos(ang) * dist;
    const sy = Math.sin(ang) * dist;

    const k = 1.1 / s.z;
    const x = cx + sx * k * Math.min(W, H) * 0.28;
    const y = cy + sy * k * Math.min(W, H) * 0.28;
    const size = s.size * k * D * (0.6 + speed * 0.3);

    if (size < 0.3) continue;

    ctx.beginPath();
    ctx.fillStyle = `hsla(${s.hue}, 80%, 80%, ${Math.min(1, (1.2 - s.z) * 0.9)})`;
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    // Motion streak when fast
    if (speed > 2 && s.z < 0.8) {
      ctx.strokeStyle = `hsla(${s.hue}, 80%, 70%, 0.25)`;
      ctx.lineWidth = size * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - sx * k * 8 * speed, y - sy * k * 8 * speed);
      ctx.stroke();
    }
  }

  // —— Galaxies orbiting the path ——
  for (const g of galaxies) {
    g.rot += g.rotSpeed * speed;
    g.angle += 0.0015 * speed;

    const depth = 0.4 + (Math.sin(g.angle + progress * 6) * 0.5 + 0.5) * 0.9;
    const gx = cx + Math.cos(g.angle) * g.dist * Math.min(W, H) * 0.35 * (1.3 - progress * 0.4);
    const gy = cy + Math.sin(g.angle) * g.dist * Math.min(W, H) * 0.22 * (1.3 - progress * 0.4);
    drawGalaxy(g, gx, gy, (1.1 - depth * 0.4) * (0.7 + progress * 0.5));
  }

  // —— Central 117 vortex ——
  const vortexScale = 0.35 + progress * 0.9;
  const pulse = 1 + Math.sin(time * 3) * 0.04;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(time * 0.15 * speed);

  // Outer energy rings
  for (let i = 5; i >= 0; i--) {
    const r = (60 + i * 28) * vortexScale * pulse * D;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${200 + i * 15 + time * 30}, 90%, 70%, ${0.08 + (5 - i) * 0.03})`;
    ctx.lineWidth = (2 + i * 0.5) * D;
    ctx.stroke();
  }

  // Core glow
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 90 * vortexScale * D);
  coreGrad.addColorStop(0, `hsla(${210 + progress * 40}, 100%, 90%, 0.55)`);
  coreGrad.addColorStop(0.4, `hsla(${230}, 100%, 60%, 0.2)`);
  coreGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(0, 0, 90 * vortexScale * D, 0, Math.PI * 2);
  ctx.fill();

  // The number 117 in the heart of the vortex
  ctx.rotate(-time * 0.15 * speed); // counter so number is more readable
  const fontSize = Math.min(W, H) * 0.14 * vortexScale * pulse;
  ctx.font = `900 ${fontSize}px Arial Black, Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(220, 245, 255, ${0.5 + progress * 0.4})`;
  ctx.shadowColor = 'rgba(100, 180, 255, 0.8)';
  ctx.shadowBlur = 24 * D;
  ctx.fillText('117', 0, 0);
  ctx.shadowBlur = 0;

  ctx.restore();

  // —— Approaching planet (late progress) ——
  if (progress > 0.72) {
    const p = (progress - 0.72) / 0.28;
    const planetR = Math.min(W, H) * (0.15 + p * 0.55);
    const planetY = cy + Math.min(H * 0.15, p * H * 0.2);

    // Atmosphere glow
    const atmo = ctx.createRadialGradient(cx, planetY, planetR * 0.7, cx, planetY, planetR * 1.4);
    atmo.addColorStop(0, 'transparent');
    atmo.addColorStop(0.6, `hsla(${160 + p * 40}, 80%, 50%, ${0.15 * p})`);
    atmo.addColorStop(1, 'transparent');
    ctx.fillStyle = atmo;
    ctx.beginPath();
    ctx.arc(cx, planetY, planetR * 1.4, 0, Math.PI * 2);
    ctx.fill();

    // Planet body
    const body = ctx.createRadialGradient(
      cx - planetR * 0.3, planetY - planetR * 0.3, 0,
      cx, planetY, planetR
    );
    body.addColorStop(0, `hsl(${170 + p * 20}, 60%, 55%)`);
    body.addColorStop(0.5, `hsl(${190}, 50%, 35%)`);
    body.addColorStop(1, `hsl(${210}, 40%, 15%)`);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(cx, planetY, planetR, 0, Math.PI * 2);
    ctx.fill();

    // Simple surface bands
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, planetY, planetR, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = `rgba(100,200,180,${0.15 * p})`;
    ctx.lineWidth = 6 * D;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.ellipse(cx, planetY + i * planetR * 0.22, planetR * 0.95, planetR * 0.12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  vig.addColorStop(0.5, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
