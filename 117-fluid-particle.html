<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 FLUID PARTICLE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id=c></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=7200;let W,H,D,pts=[],mask,mc,mouse={x:0,y:0,on:false};
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);mask=document.createElement('canvas');mask.width=W;mask.height=H;mc=mask.getContext('2d');mc.fillStyle='#000';mc.textAlign='center';mc.textBaseline='middle';mc.font='900 '+Math.floor(Math.min(W*.504,H*.432))+'px Impact,Arial Narrow,Arial';mc.fillText('117',W/2,H/2);seed()}
function hit(px,py){return mc.getImageData(Math.max(0,Math.min(W-1,px|0)),Math.max(0,Math.min(H-1,py|0)),1,1).data[3]>0}
function target(){let px,py,n=0;do{px=W*.22+Math.random()*W*.56;py=H*.31+Math.random()*H*.38;n++}while(!hit(px,py)&&n<100);return[px,py]}
function seed(){pts=[];for(let i=0;i<N;i++){let q=target(),a=Math.random()*6.28,r=Math.random()*Math.min(W,H)*.34;pts.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0,tx:q[0],ty:q[1],s:.45+Math.random()*1.45,p:Math.random()*6.28})}}
function loop(ms){let t=ms*.001;x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);for(let p of pts){let dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy)+.01;let wave=Math.sin(t*1.25+p.p+p.ty*.018);p.vx+=dx*.0048+(-dy/dd)*wave*.010;p.vy+=dy*.0048+(dx/dd)*wave*.010+.008*Math.sin(t*2+p.p);if(mouse.on){let ax=p.x-mouse.x,ay=p.y-mouse.y,d2=ax*ax+ay*ay;if(d2<11000){let f=(1-Math.sqrt(d2)/105)*.8;p.vx+=ax*f*.035;p.vy+=ay*f*.035}}p.vx*=.935;p.vy*=.935;p.x+=p.vx;p.y+=p.vy;if(Math.random()<.00045){let q=target();p.tx=q[0];p.ty=q[1]}let speed=Math.hypot(p.vx,p.vy);let hue=188+32*Math.sin(p.p+t*.25)+18*Math.min(1,speed/4);x.beginPath();x.arc(p.x,p.y,p.s*(1+Math.min(speed,4)*.08),0,6.283);x.fillStyle='hsla('+hue+',88%,'+(36+Math.min(speed,5)*5)+'%,'+(.34+p.s*.25)+')';x.fill()}requestAnimationFrame(loop)}
c.onpointerdown=e=>{mouse={x:e.clientX,y:e.clientY,on:true}};c.onpointermove=e=>{if(mouse.on){mouse.x=e.clientX;mouse.y=e.clientY}};c.onpointerup=()=>mouse.on=false;addEventListener('resize',resize);resize();requestAnimationFrame(loop);
</script></body></html>
