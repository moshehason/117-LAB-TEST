sicalMaterial({color:0xc8c8c8,metalness:1,roughness:.19,clearcoat:1,clearcoatRoughness:.12,iridescence:.28,iridescenceIOR:1.5});mesh=new THREE.Mesh(geo,mat);g.add(mesh)});let px=0,py=0,tx=0,ty=0,drag=false,last=0;r.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;r.domElement.setPointerCapture(e.pointerId)});r.domElement.addEventListener('pointermove',e=>{if(drag){ty+=(e.clientX-last)*.004;ty=Math.max(-.65,Math.min(.65,ty));last=e.clientX}else{tx=(e.clientY/innerHeight-.5)*-.25;ty=(e.clientX/innerWidth-.5)*.28}});r.domElement.addEventListener('pointerup',()=>drag=false);const clock=new THREE.Clock();function a(){requestAnimationFrame(a);let t=clock.getElapsedTime(),breath=1+Math.sin(t*1.35)*.035+Math.sin(t*.53)*.012;g.scale.set(.5*breath,.5*(1+Math.sin(t*1.35+.5)*.025),.5*breath);px+=(tx-px)*.04;py+=(ty-py)*.04;g.rotation.x=px+Math.sin(t*.42)*.04;g.rotation.y=py+Math.sin(t*.31)*.12;if(mesh){mesh.material.roughness=.16+(Math.sin(t*.8)+1)*.035}r.render(s,c)}a();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
