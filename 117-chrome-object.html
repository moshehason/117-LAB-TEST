<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 CHROME</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1200px}.logo{position:relative;width:min(82vw,720px);height:min(58vw,510px);transform-style:preserve-3d;filter:drop-shadow(0 28px 22px #0003);will-change:transform}.n{position:absolute;font:900 clamp(190px,35vw,390px)/.78 Arial Black,Impact,sans-serif;color:#bfc3c6;-webkit-text-stroke:2px #4b4f52;text-shadow:0 1px 0 #fff,0 2px 0 #777,0 4px 0 #555,0 7px 0 #333,0 10px 0 #222,0 14px 0 #111,0 20px 12px #0005;background:linear-gradient(105deg,#555 0%,#f7f7f4 12%,#8a8e90 24%,#fff 39%,#4c5053 54%,#e9e7df 69%,#777 82%,#fff 94%,#555);-webkit-background-clip:text;background-clip:text;color:transparent;filter:contrast(1.12)}.a{left:3%;top:16%}.b{left:31%;top:12%}.c{left:57%;top:8%}.glint{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff,0 0 18px #fff8;animation:g 2.6s ease-in-out infinite}.glint:before,.glint:after{content:"";position:absolute;left:50%;top:50%;background:#fff;transform:translate(-50%,-50%)}.glint:before{width:72px;height:2px}.glint:after{width:2px;height:72px}.g1{left:20%;top:22%}.g2{left:69%;top:16%;animation-delay:.8s}.g3{left:78%;top:69%;animation-delay:1.5s}@keyframes g{0%,65%,100%{opacity:0;transform:scale(.2) rotate(0)}75%{opacity:1;transform:scale(1) rotate(45deg)}85%{opacity:0;transform:scale(.35) rotate(90deg)}}.tag,.hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));font:700 9px Arial;letter-spacing:.18em;color:#111}.tag{left:16px}.hint{right:16px;color:#777}</style></head><body><div class="stage"><div class="logo" id="logo"><div class="n a">1</div><div class="n b">1</div><div class="n c">7</div><i class="glint g1"></i><i class="glint g2"></i><i class="glint g3"></i></div></div><div class="tag">117 / CHROME OBJECT</div><div class="hint">DRAG / 360°</div><script>const e=document.querySelector('#logo');let drag=0,lx=0,ly=0,rx=-9,ry=-18,tx=rx,ty=ry;e.onpointerdown=q=>{drag=1;lx=q.clientX;ly=q.clientY;e.setPointerCapture(q.pointerId)};e.onpointermove=q=>{if(!drag)return;ty+=(q.clientX-lx)*.45;tx=Math.max(-42,Math.min(42,tx-(q.clientY-ly)*.28));lx=q.clientX;ly=q.clientY};e.onpointerup=e.onpointercancel=()=>drag=0;function f(){if(!drag)ty+=.12;rx+=(tx-rx)*.06;ry+=(ty-ry)*.06;e.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';requestAnimationFrame(f)}f()</script></body></html>
