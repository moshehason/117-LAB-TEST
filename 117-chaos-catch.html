<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — CHAOS CATCH</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;touch-action:none;font-family:Arial Black,Arial,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .ui{
    position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:space-between;padding:0 16px;
    font:900 14px/1 Arial;color:#fff;z-index:10;pointer-events:none;
    text-shadow:0 0 10px #000;
  }
  .msg{
    position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(0,0,0,.75);z-index:20;color:#fff;
    font:900 clamp(28px,8vw,52px)/1.1 Arial Black;text-align:center;
    padding:20px;cursor:pointer;
  }
  .msg small{display:block;font:700 14px Arial;margin-top:12px;opacity:.7;letter-spacing:.1em}
  .hint{
    position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);
    font:700 10px/1 Arial;letter-spacing:.15em;color:rgba(255,255,255,.4);
    z-index:10;pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div>SCORE <span id="score">0</span></div>
  <div>BEST <span id="best">0</span></div>
</div>
<div class="msg" id="start">
  117 CHAOS CATCH
  <small>TAP TO START · CATCH ONLY 117</small>
</div>
<div class="hint">MOVE YOUR FINGER · CATCH 117 · AVOID THE REST</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startEl = document.getElementById('start');

let W, H, D;
let running = false;
let score = 0;
let best = +localStorage.getItem('117chaos-best') || 0;
bestEl.textContent = best;

let player = { x: 0.5, y: 0.75, r: 28 };
let items = [];
let particles = [];
let spawnTimer = 0;
let shake = 0;
let time = 0;

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  player.r = Math.min(W, H) * 0.045;
}
resize();
addEventListener('resize', resize);

function setPos(e) {
  const t = e.touches ? e.touches[0] : e;
  player.x = t.clientX / innerWidth;
  player.y = Math.min(0.92, Math.max(0.15, t.clientY / innerHeight));
}

canvas.addEventListener('pointerdown', e => { setPos(e); canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', setPos);
canvas.addEventListener('touchmove', e => { e.preventDefault(); setPos(e); }, {passive:false});

startEl.onclick = () => {
  startEl.style.display = 'none';
  running = true;
  score = 0;
  scoreEl.textContent = 0;
  items = [];
  particles = [];
  spawnTimer = 0;
};

function spawn() {
  const is117 = Math.random() < 0.38;
  const texts = is117 ? ['117'] : ['11', '17', '71', '77', '1', '7', '111', '70', '10', '27', '71', '91'];
  items.push({
    x: Math.random(),
    y: -0.1,
    vx: (Math.random() - 0.5) * 0.004,
    vy: 0.003 + Math.random() * 0.006,
    r: (18 + Math.random() * 22) * D,
    text: texts[Math.floor(Math.random() * texts.length)],
    good: is117,
    rot: Math.random() * 6,
    rotSpeed: (Math.random() - 0.5) * 0.08,
    hue: is117 ? 40 + Math.random() * 40 : Math.random() * 360
  });
}

function burst(x, y, good) {
  for (let i = 0; i < 14; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8 * D,
      vy: (Math.random() - 0.5) * 8 * D,
      life: 1,
      color: good ? `hsl(${40 + Math.random()*30},100%,60%)` : `hsl(${Math.random()*360},80%,55%)`
    });
  }
}

function frame(ms) {
  requestAnimationFrame(frame);
  time = ms * 0.001;

  // Background
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40 * D) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  if (!running) {
    // Idle floating 117s
    ctx.save();
    ctx.translate(W/2, H/2);
    ctx.rotate(Math.sin(time) * 0.1);
    ctx.font = `900 ${Math.min(W,H)*0.28}px Arial Black`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,200,50,0.15)';
    ctx.fillText('117', 0, 0);
    ctx.restore();
    return;
  }

  // Shake
  if (shake > 0) {
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake*D, (Math.random()-0.5)*shake*D);
    shake *= 0.9;
  }

  // Spawn
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(18, 45 - score * 0.4);
  }

  // Update items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.x += it.vx;
    it.y += it.vy;
    it.vy += 0.00015; // gravity
    it.rot += it.rotSpeed;

    // Draw
    ctx.save();
    ctx.translate(it.x * W, it.y * H);
    ctx.rotate(it.rot);
    ctx.font = `900 ${it.r * 1.6}px Arial Black`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (it.good) {
      ctx.shadowColor = '#ffaa00';
      ctx.shadowBlur = 18 * D;
      ctx.fillStyle = '#ffcc44';
    } else {
      ctx.fillStyle = `hsla(${it.hue},70%,55%,0.85)`;
    }
    ctx.fillText(it.text, 0, 0);
    ctx.restore();

    // Collision
    const dx = (it.x - player.x) * W;
    const dy = (it.y - player.y) * H;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < player.r + it.r * 0.6) {
      burst(it.x * W, it.y * H, it.good);
      if (it.good) {
        score += 1;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('117chaos-best', best);
        }
      } else {
        // Wrong catch → big shake + penalty feel
        shake = 14;
        score = Math.max(0, score - 2);
        scoreEl.textContent = score;
      }
      items.splice(i, 1);
      continue;
    }

    // Off screen
    if (it.y > 1.2) items.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15 * D;
    p.life -= 0.025;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * D * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Player (the catcher – a glowing 117 ring)
  const px = player.x * W;
  const py = player.y * H;
  ctx.beginPath();
  ctx.arc(px, py, player.r, 0, Math.PI * 2);
  ctx.strokeStyle = '#ffcc44';
  ctx.lineWidth = 3 * D;
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 20 * D;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.font = `900 ${player.r * 0.9}px Arial Black`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('117', px, py);

  if (shake > 0.5) ctx.restore();
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
