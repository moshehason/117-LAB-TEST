<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>PIG RUNNER 117</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:100%;height:100%;display:block;background:transparent}.tag{position:fixed;left:14px;bottom:max(12px,env(safe-area-inset-bottom));font:700 9px Arial;letter-spacing:.17em;color:#111}</style></head><body><canvas id=c></canvas><div class=tag>117 / PIG RUNNER</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let w,h,d,start=performance.now();
function R(){d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);w=innerWidth;h=innerHeight}R();onresize=R;
function line(a,b,c,d){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke()}
function pig(px,py,s,t){let ph=t*11,bob=Math.sin(ph*2)*s*.025,run=Math.sin(ph),run2=Math.sin(ph+Math.PI);x.save();x.translate(px,py+bob);x.scale(s,s);x.lineWidth=.026;x.strokeStyle='#050505';x.fillStyle='#fff';x.lineJoin='miter';x.lineCap='square';
// body
x.beginPath();x.moveTo(-.28,-.28);x.quadraticCurveTo(-.05,-.42,.20,-.25);x.lineTo(.25,.15);x.quadraticCurveTo(.05,.31,-.22,.18);x.closePath();x.fill();x.stroke();
// pig head + snout
x.beginPath();x.moveTo(.12,-.38);x.quadraticCurveTo(.30,-.49,.43,-.34);x.lineTo(.48,-.23);x.quadraticCurveTo(.54,-.17,.47,-.10);x.lineTo(.30,-.09);x.quadraticCurveTo(.16,-.14,.12,-.25);x.closePath();x.fill();x.stroke();
// ears
x.beginPath();x.moveTo(.18,-.39);x.lineTo(.15,-.57);x.lineTo(.28,-.43);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(.31,-.40);x.lineTo(.36,-.56);x.lineTo(.40,-.37);x.closePath();x.fill();x.stroke();
// snout disk + nostrils
x.beginPath();x.ellipse(.46,-.19,.095,.065,0,0,7);x.fill();x.stroke();x.fillStyle='#111';x.fillRect(.425,-.205,.014,.018);x.fillRect(.478,-.205,.014,.018);
// eye
x.fillRect(.315,-.30,.022,.022);
// arms pumping
x.strokeStyle='#050505';x.lineWidth=.11;line(-.08,-.19,.16+run*.09,-.02);line(-.16,-.13,-.32-run*.08,.06);
// legs exaggerated rabbit-run silhouette
x.lineWidth=.15;line(-.10,.15,.13+run*.20,.48);line(-.13,.15,-.39-run*.20,.37);x.lineWidth=.026;x.fillStyle='#fff';x.beginPath();x.ellipse(.18+run*.20,.50,.20,.085,-.08,0,7);x.fill();x.stroke();x.beginPath();x.ellipse(-.44-run*.20,.39,.23,.09,.08,0,7);x.fill();x.stroke();
// tiny curled pig tail
x.beginPath();x.arc(-.29,-.13,.08,0,Math.PI*1.7);x.stroke();
x.restore()}
function F(ms){let t=(ms-start)/1000;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);let s=Math.min(w,h)*.28,span=w+s*2.3,px=((t*150)%span)-s*.7,py=h*.52;pig(px,py,s,t);hunter(px-s*.95,py,s*.92,t);
// unstable distortion tears around the chase
if(Math.sin(t*5.3)+Math.sin(t*12.7)>.65){for(let i=0;i<7;i++){let yy=py-s*.65+i*s*.20,hh=2+(i%3)*3,dx=Math.sin(t*19+i*4.1)*(12+8*i);x.drawImage(c,0,yy*d,c.width,hh*d,dx,yy,w,hh)}}
for(let i=0;i<9;i++){let yy=(.5+.5*Math.sin(t*(2.1+i*.17)+i*8.3))*h;x.fillStyle=i%4===0?'rgba(0,220,255,.32)':i%5===0?'rgba(255,25,185,.26)':'rgba(0,0,0,.12)';x.fillRect(0,yy,w,1+(i%3))}
requestAnimationFrame(F)}requestAnimationFrame(F);
</script></body></html>
