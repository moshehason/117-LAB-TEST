<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 BACKROOMS V2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}#grain,#fade,#flash{position:fixed;inset:0;pointer-events:none}#grain{z-index:4;opacity:.2;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:g .09s steps(2) infinite}@keyframes g{50%{transform:translate(-3px,2px)}}#flash{z-index:5;background:white;opacity:0}#fade{z-index:6;background:#000;opacity:0}</style></head><body><div id="grain"></div><div id="flash"></div><div id="fade"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const S=new THREE.Scene();S.background=new THREE.Color(0x010101);S.fog=new THREE.FogExp2(0x010101,.052);const C=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.04,140),R=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.4));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const M={wall:new THREE.MeshStandardMaterial({color:.42*0xffffff,roughness:1}),floor:new THREE.MeshStandardMaterial({color:0x101010,roughness:1}),void:new THREE.MeshBasicMaterial({color:0}),bone:new THREE.MeshBasicMaterial({color:0xbdbdbd})};

let floor=mesh(new THREE.PlaneGeometry(16,125),M.floor,0,0,-48);floor.rotation.x=-Math.PI/2;let ceil=floor.clone();ceil.position.y=4.4;ceil.rotation.x=Math.PI/2;S.add(ceil);
for(let z=6;z>-102;z-=5){let b=Math.sin(z*.105)*1.55+Math.sin(z*.037)*.7;mesh(new THREE.BoxGeometry(1.2,4.4,4.8),M.wall,-5+b,2.2,z);mesh(new THREE.BoxGeometry(1.2,4.4,4.8),M.wall,5+b,2.2,z);if((Math.round(-z/5)%3)==0){mesh(new THREE.BoxGeometry(.28,4.4,.35),M.floor,-3.15+b,2.2,z);mesh(new THREE.BoxGeometry(.28,4.4,.35),M.floor,3.15+b,2.2,z)}}
for(let z=1;z>-92;z-=10){let b=Math.sin(z*.105)*1.55+Math.sin(z*.037)*.7,l=new THREE.PointLight(0xffffff,10,12,2);l.position.set(b,3.85,z);S.add(l);mesh(new THREE.BoxGeometry(2.2,.05,.1),new THREE.MeshBasicMaterial({color:0xffffff}),b,4.12,z)}
function humanoid(scale=1){let g=new THREE.Group(),tor=new THREE.Mesh(new THREE.CapsuleGeometry(.27,1.7,4,7),M.void),head=new THREE.Mesh(new THREE.SphereGeometry(.28,8,7),M.void);tor.position.y=1.55;head.position.y=2.75;head.scale.set(.72,1.35,.7);g.add(tor,head);for(let s of [-1,1]){let arm=new THREE.Mesh(new THREE.CapsuleGeometry(.09,1.9,3,6),M.void);arm.position.set(s*.38,1.5,0);arm.rotation.z=s*.1;g.add(arm);let leg=new THREE.Mesh(new THREE.CapsuleGeometry(.11,1.8,3,6),M.void);leg.position.set(s*.17,.25,0);g.add(leg)}g.scale.setScalar(scale);S.add(g);return g}
const tall=humanoid(1.32);tall.position.set(-1.8,0,-31);
const watcher=humanoid(.95);watcher.position.set(2.4,0,-49);watcher.rotation.y=Math.PI;
const crawler=new THREE.Group();let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,1.25,4,7),M.void);torso.rotation.z=Math.PI/2;torso.position.y=.65;crawler.add(torso);for(let s of [-1,1])for(let q of [-1,1]){let limb=new THREE.Mesh(new THREE.CapsuleGeometry(.08,1.15,3,6),M.void);limb.position.set(q*.48,.5,s*.25);limb.rotation.z=q*.85;crawler.add(limb)}let ch=new THREE.Mesh(new THREE.SphereGeometry(.25,7,6),M.void);ch.position.set(.82,.72,0);crawler.add(ch);crawler.position.set(-2.4,0,-59);S.add(crawler);
const altar=mesh(new THREE.BoxGeometry(3.8,1.1,1.8),M.floor,0,.55,-94);altar.visible=false;const cv=document.createElement('canvas');cv.width=512;cv.height=256;let x=cv.getContext('2d');x.fillStyle='#fff';x.font='900 190px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('117',256,128);const sign=mesh(new THREE.PlaneGeometry(4.4,2.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,side:2}),0,2,-93);sign.visible=false;
const ritual=new THREE.Group();for(let i=-2;i<=2;i++){let h=humanoid(.78);S.remove(h);h.position.set(i*1.25,0,-96-Math.abs(i)*.5);ritual.add(h)}ritual.visible=false;S.add(ritual);
const dL=mesh(new THREE.BoxGeometry(3.2,4.4,.25),M.floor,-1.6,2.2,-88),dR=mesh(new THREE.BoxGeometry(3.2,4.4,.25),M.floor,1.6,2.2,-88);
const final=humanoid(1.7);final.position.set(0,0,-101);final.visible=false;final.children[1].scale.set(.42,1.8,.4);final.children.slice(2).forEach((p,i)=>{p.scale.y=i<2?1.7:1.3});let jaw=new THREE.Mesh(new THREE.TorusGeometry(.38,.1,5,12,Math.PI),M.bone);jaw.rotation.z=Math.PI;jaw.position.set(0,3.15,.28);final.add(jaw);
S.add(new THREE.HemisphereLight(0x777777,0,.38));C.position.set(0,1.65,5);let start=performance.now(),tilt=0,drag=0,down=false,px=0;
addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/45,-1,1)},{passive:true});addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){drag+=(e.clientX-px)*.002;px=e.clientX}});
const E=(a,b,t)=>{t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)};
function frame(n){requestAnimationFrame(frame);let t=(n-start)/1000,z=t<18?5-E(0,18,t)*86:-81-E(18,21,t)*5.2,b=Math.sin(z*.105)*1.4+Math.sin(z*.037)*.6;C.position.x+=(b+tilt*.4+drag-C.position.x)*.055;C.position.z=z;C.position.y=1.65+Math.sin(t*8)*.024;C.rotation.y+=(-Math.sin(z*.105)*.13-tilt*.07-drag*.25-C.rotation.y)*.05;
tall.position.x=-1.8+Math.sin(t*.9)*.4;tall.children[2].rotation.z=.25+Math.sin(t*2)*.16;tall.children[3].rotation.z=-.25-Math.sin(t*2)*.16;
crawler.position.x=-2.4+E(9,12,t)*5.7;crawler.rotation.y=Math.sin(t*12)*.08;if(t>12.2)crawler.visible=false;
if(t>10&&t<14)watcher.position.z=-49+(t-10)*1.1;if(t>14)watcher.position.set(.6,0,-66);
if(t>18){let o=E(18,20,t);dL.position.x=-1.6-o*2.7;dR.position.x=1.6+o*2.7}if(t>20){altar.visible=sign.visible=ritual.visible=true;ritual.children.forEach((q,i)=>{q.rotation.z=Math.sin(t*2+i)*.025})}
if(t>23.5){final.visible=true;let a=E(23.5,26.1,t);final.position.z=-101+a*15;final.scale.setScalar(1+a*1.8);final.rotation.z=Math.sin(t*17)*.035*a;final.children[2].rotation.z=Math.sin(t*13)*.45;final.children[3].rotation.z=-Math.sin(t*13)*.45}
if(t>25.7){sign.visible=false;document.querySelector('#flash').style.opacity=Math.max(0,1-(t-25.7)*4)}if(t>26.3)document.querySelector('#fade').style.opacity=E(26.3,27.3,t);
if(t>28){start=n;dL.position.x=-1.6;dR.position.x=1.6;altar.visible=sign.visible=ritual.visible=final.visible=true;final.visible=false;final.position.set(0,0,-101);final.scale.setScalar(1.7);crawler.visible=true;crawler.position.set(-2.4,0,-59);watcher.position.set(2.4,0,-49);document.querySelector('#fade').style.opacity=0}R.render(S,C)}requestAnimationFrame(frame);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})</script></body></html>
