<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — עברית</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#0c0c0c;color:#f5f0e8;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
  }
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  .words{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;
    text-align:center;padding:20px;
  }
  .big{
    font-size:clamp(64px,18vw,160px);
    font-weight:900;
    letter-spacing:-0.04em;
    line-height:0.9;
    color:#fff;
    text-shadow:0 0 40px rgba(255,200,120,0.35);
    transition:transform 0.4s ease, opacity 0.4s;
  }
  .line{
    margin-top:18px;
    font-size:clamp(15px,3.8vw,22px);
    font-weight:600;
    letter-spacing:0.04em;
    color:rgba(255,240,220,0.75);
    max-width:90vw;
    line-height:1.5;
    opacity:0;
    transform:translateY(12px);
    transition:opacity 0.8s ease, transform 0.8s ease;
  }
  .line.on{opacity:1;transform:translateY(0)}
  
</style>
<style id="117-transparent-bg">html,body{background:transparent!important;background-color:transparent!important}canvas{background:transparent!important}</style></head>
<body>
<canvas id="c"></canvas>
<div class="words">
  <div class="big" id="num">117</div>
  <div class="line" id="line"></div>
</div>


<script>
const PHRASES = [
  "המספר שמוצא אותך",
  "לא שם. תדר.",
  "הקירות זוכרים",
  "הוא נשאר גם כשאתה עוזב",
  "הלילה מכיר אותו",
  "בין מה שנאמר למה שהתכוונו",
  "הוא לא מסביר את עצמו",
  "אתה כבר יודע",
  "הדלת נפתחת לשני הכיוונים",
  "חיפשת משמעות. הוא חיפש אותך",
  "תספור לאט",
  "היה כאן לפני הבניין",
  "לא מקרי. לא צירוף מקרים",
  "העיר סופרת אחרת",
  "הוא צופה",
  "רק עדים. לא מאמינים",
  "מה שנשאר כשהסיפור נגמר",
  "נספר יותר פעמים משהובן"
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const numEl = document.getElementById('num');
const lineEl = document.getElementById('line');
let W, H, D, time = 0;
let particles = [];
let phraseIndex = 0;

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
resize();
addEventListener('resize', resize);

function showPhrase() {
  lineEl.classList.remove('on');
  setTimeout(() => {
    lineEl.textContent = PHRASES[phraseIndex % PHRASES.length];
    phraseIndex++;
    lineEl.classList.add('on');
  }, 200);
}
showPhrase();

function burst(x, y) {
  for (let i = 0; i < 28; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 5;
    particles.push({
      x: x * D, y: y * D,
      vx: Math.cos(a) * sp * D,
      vy: Math.sin(a) * sp * D,
      life: 1,
      size: (1.5 + Math.random() * 3) * D
    });
  }
}

function onTap(e) {
  const t = e.touches ? e.touches[0] : e;
  burst(t.clientX, t.clientY);
  showPhrase();
  numEl.style.transform = 'scale(1.12)';
  setTimeout(() => numEl.style.transform = '', 280);
}

window.addEventListener('pointerdown', onTap);
window.addEventListener('touchstart', onTap, {passive:true});

// Auto cycle phrases slowly
setInterval(showPhrase, 5200);

function frame(ms) {
  requestAnimationFrame(frame);
  time = ms * 0.001;

  // Soft dark background with warm vignette
  ctx.clearRect(0, 0, W, H);

  

  // Floating dust
  for (let i = 0; i < 40; i++) {
    const x = (Math.sin(time * 0.3 + i * 1.7) * 0.5 + 0.5) * W;
    const y = (Math.cos(time * 0.25 + i * 1.3) * 0.5 + 0.5) * H;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,220,160,${0.04 + Math.sin(time + i)*0.03})`;
    ctx.arc(x, y, 1.2 * D, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles from taps
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06 * D;
    p.life -= 0.018;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#ffd090';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
