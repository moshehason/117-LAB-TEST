<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>117 SLIME MOLD</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id=c></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:true});let W,H,dpr,pts=[],trail,tc,tx,mask,mc,mx,pointer=null;
function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);tc=document.createElement('canvas');tc.width=Math.floor(W*dpr);tc.height=Math.floor(H*dpr);tx=tc.getContext('2d');mask=document.createElement('canvas');mask.width=W;mask.height=H;mx=mask.getContext('2d');mx.clearRect(0,0,W,H);mx.fillStyle='#fff';mx.textAlign='center';mx.textBaseline='middle';mx.font='900 '+Math.floor(Math.min(W*.68,H*.68))+'px Arial Black,Arial';mx.fillText('117',W*.5,H*.50);trail=new Float32Array(Math.max(1,Math.floor(W/3))*Math.max(1,Math.floor(H/3)));seed()}
function inside(px,py){return mx.getImageData(Math.max(0,Math.min(W-1,px|0)),Math.max(0,Math.min(H-1,py|0)),1,1).data[3]>0}
function seed(){pts=[];for(let i=0;i<5200;i++){let px,py,k=0;do{px=Math.random()*W;py=Math.random()*H;k++}while(!inside(px,py)&&k<80);pts.push({x:px,y:py,a:Math.random()*6.283})}}
function sense(p,ang,dist){let xx=p.x+Math.cos(ang)*dist,yy=p.y+Math.sin(ang)*dist;if(xx<0||yy<0||xx>=W||yy>=H)return-9;let sw=Math.max(1,Math.floor(W/3)),sh=Math.max(1,Math.floor(H/3));return trail[Math.min(sh-1,Math.max(0,(yy/3)|0))*sw+Math.min(sw-1,Math.max(0,(xx/3)|0))]}
function step(t){let sw=Math.max(1,Math.floor(W/3)),sh=Math.max(1,Math.floor(H/3));let nt=new Float32Array(trail.length);for(let y=1;y<sh-1;y++)for(let xx=1;xx<sw-1;xx++){let i=y*sw+xx;nt[i]=(trail[i]*2+trail[i-1]+trail[i+1]+trail[i-sw]+trail[i+sw])*.155}trail=nt;
for(const p of pts){let f=sense(p,p.a,14),l=sense(p,p.a-.55,14),r=sense(p,p.a+.55,14);if(l>f&&l>r)p.a-=.38;else if(r>f&&r>l)p.a+=.38;else if(f<l&&f<r)p.a+=(Math.random()-.5)*1.0;p.a+=(Math.random()-.5)*.16;if(pointer){let dx=pointer.x-p.x,dy=pointer.y-p.y,dd=dx*dx+dy*dy;if(dd<18000)p.a=p.a*.84+Math.atan2(dy,dx)*.16}let nx=p.x+Math.cos(p.a)*1.25,ny=p.y+Math.sin(p.a)*1.25;if(!inside(nx,ny)){p.a+=2.2+(Math.random()-.5)*1.3;nx=p.x;ny=p.y}p.x=nx;p.y=ny;let ix=(p.x/3)|0,iy=(p.y/3)|0;if(ix>=0&&iy>=0&&ix<sw&&iy<sh)trail[iy*sw+ix]=Math.min(1,trail[iy*sw+ix]+.32)}
x.clearRect(0,0,W,H);x.save();x.globalCompositeOperation='source-over';x.fillStyle='rgba(0,0,0,.78)';for(let y=0;y<sh;y+=2)for(let xx=0;xx<sw;xx+=2){let v=trail[y*sw+xx];if(v>.035){x.globalAlpha=Math.min(.8,v*1.5);x.fillRect(xx*3,y*3,4,4)}}x.globalAlpha=.82;x.fillStyle='#000';for(let i=0;i<pts.length;i+=2){let p=pts[i];x.fillRect(p.x,p.y,1.15,1.15)}x.restore();requestAnimationFrame(step)}
c.addEventListener('pointermove',e=>pointer={x:e.clientX,y:e.clientY});c.addEventListener('pointerdown',e=>pointer={x:e.clientX,y:e.clientY});c.addEventListener('pointerup',()=>pointer=null);addEventListener('resize',resize);resize();requestAnimationFrame(step);
</script></body></html>
