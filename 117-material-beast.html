ps://cdn.jsdelivr.net/npm/three@0.180.0/examples/fonts/helvetiker_bold.typeface.json',f=>{['1','1','7'].forEach((ch,i)=>{const q=new TextGeometry(ch,{font:f,size:2.8,depth:1.15,curveSegments:14,bevelEnabled:true,bevelThickness:.18,bevelSize:.12,bevelSegments:8});q.computeBoundingBox();q.translate(-(q.boundingBox.max.x+q.boundingBox.min.x)/2,-(q.boundingBox.max.y+q.boundingBox.min.y)/2,0);const m=new THREE.Mesh(q,mats[i===2?0:i]);m.position.x=(i-1)*2.15;g.add(m);parts.push(m);for(let k=0;k<7;k++){let drip=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.09,12,12),mats[2]);drip.scale.y=2+Math.random()*4;drip.position.set(m.position.x+(Math.random()-.5)*1.1,-1.45-Math.random()*.75,.35+Math.random()*.8);g.add(drip)}});for(let i=0;i<9;i++){const tooth=new THREE.Mesh(new THREE.ConeGeometry(.12,.38,10),new THREE.MeshStandardMaterial({color:0xe8d8bd,roughness:.48}));tooth.rotation.z=Math.PI+(Math.random()-.5)*.35;tooth.position.set(.95+i*.18, .52+Math.sin(i)*.08,1.2);g.add(tooth)}});let target=0,ry=0,drag=false,last=0;r.domElement.onpointerdown=e=>{drag=true;last=e.clientX};r.domElement.onpointermove=e=>{if(drag){target+=(e.clientX-last)*.004;target=Math.max(-.72,Math.min(.72,target));last=e.clientX}};r.domElement.onpointerup=()=>drag=false;let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let t=clock.getElapsedTime(),b=1+Math.sin(t*1.15)*.035;g.scale.set(.5*b,.5*(1+Math.sin(t*1.15+.5)*.025),.5*b);g.position.y=Math.sin(t*.7)*.13;ry+=(target-ry)*.055;g.rotation.y=ry+Math.sin(t*.3)*.12;parts.forEach((p,i)=>p.rotation.z=Math.sin(t*.7+i)*.012);pink.intensity=24+(Math.sin(t*1.4)+1)*8;r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
