<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 RAYMARCH MERCURY</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f2f2f0}canvas{width:100%;height:100%;display:block}.tag{position:fixed;left:16px;bottom:15px;font:10px monospace;letter-spacing:.18em;opacity:.35}</style></head><body><canvas id=c></canvas><div class=tag>117 / SDF RAYMARCH MERCURY</div><script>const gl=c.getContext('webgl',{antialias:false});const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';const fs=`precision highp float;uniform vec2 R;uniform float T;float sph(vec3 p,float r){return length(p)-r;}float sm(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k*.25;}float seg(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}float map(vec3 p){float wob=.035*sin(T*1.7+p.y*5.)+.018*sin(T*.7+p.x*7.);p.x+=wob;float d=99.;d=sm(d,seg(p,vec3(-.82,-.75,0),vec3(-.82,.72,0),.18),.16);d=sm(d,seg(p,vec3(-.40,-.75,0),vec3(-.40,.72,0),.18),.16);d=sm(d,seg(p,vec3(.05,.68,0),vec3(.72,.68,0),.18),.16);d=sm(d,seg(p,vec3(.72,.68,0),vec3(.30,-.76,0),.18),.16);float pulse=.10+.04*sin(T*1.2);d=sm(d,sph(p-vec3(-.63,-.05,.05),pulse),.20);d=sm(d,sph(p-vec3(.48,.15,-.02),.11+.035*sin(T*1.5)),.18);return d;}vec3 norm(vec3 p){vec2 e=vec2(.002,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}void main(){vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;vec3 ro=vec3(0,0,-3.6),rd=normalize(vec3(uv,1.45));float t=0.,d=0.;bool hit=false;for(int i=0;i<96;i++){vec3 p=ro+rd*t;d=map(p);if(d<.0025){hit=true;break;}t+=d*.72;if(t>8.)break;}if(!hit){gl_FragColor=vec4(vec3(.94),1);return;}vec3 p=ro+rd*t,n=norm(p),v=normalize(ro-p);float fres=pow(1.-max(dot(n,v),0.),3.);vec3 l=normalize(vec3(-.4,.7,-.5));float sp=pow(max(dot(reflect(-l,n),v),0.),90.);float dif=max(dot(n,l),0.);float bands=.5+.5*sin((n.x+n.y*.7+p.y*.18)*13.);vec3 chrome=mix(vec3(.10),vec3(.92),.30+.45*dif+.18*bands);chrome+=sp*1.8+fres*.45;gl_FragColor=vec4(pow(chrome,vec3(.82)),1);}`;function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}let P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,vs));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(P);gl.useProgram(P);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(P,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let uR=gl.getUniformLocation(P,'R'),uT=gl.getUniformLocation(P,'T');function resize(){let d=Math.min(devicePixelRatio,1.6);c.width=innerWidth*d;c.height=innerHeight*d;gl.viewport(0,0,c.width,c.height)}resize();onresize=resize;let st=performance.now();function loop(n){gl.uniform2f(uR,c.width,c.height);gl.uniform1f(uT,(n-st)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
