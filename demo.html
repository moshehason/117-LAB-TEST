<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>117 LAB</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f3f2ed;color:#111;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#f3f2edeF;backdrop-filter:blur(10px);padding:14px 16px;border-bottom:1px solid #bbb;display:flex;justify-content:space-between;align-items:center}b{font-size:22px}nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;position:sticky;top:52px;z-index:19;background:#f3f2ed}button{border:1px solid #111;background:white;padding:10px 12px;white-space:nowrap;font:700 11px monospace}.panel{display:none}.panel.on{display:block}.stage{height:calc(100vh - 112px);min-height:520px;display:grid;place-items:center;position:relative;overflow:hidden;perspective:1200px}.frame{width:min(68vw,390px);position:relative;transform-style:preserve-3d}.shadow{position:absolute;inset:3%;background:#000;filter:blur(22px);opacity:.28;transform:translate(var(--sx,18px),var(--sy,20px))}.art{position:relative;aspect-ratio:4/5;background:#fff;border:2px solid #111;display:grid;place-items:center;overflow:hidden}.num{font:900 clamp(88px,24vw,170px) Arial;letter-spacing:-.1em}.art:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,#fff9 50%,transparent 60%);transform:translateX(var(--shine,-40%))}.pig{position:absolute;left:-150px;bottom:14%;font-size:78px;animation:run 7s linear infinite;filter:grayscale(1) contrast(2)}@keyframes run{to{transform:translateX(calc(100vw + 300px))}}.tiltbtn{position:absolute;bottom:24px;z-index:5}.jp{font:700 8vw serif;writing-mode:vertical-rl;position:absolute;right:7%;top:8%}.glitch .num{animation:g 2.8s steps(7) infinite}@keyframes g{50%{transform:skewX(25deg) scaleY(.65);text-shadow:18px 0 #26f,-12px 0 #f43}}.crt{background:#050505;color:#eef}.crt .num{font-size:38vw;animation:c 3.2s infinite}@keyframes c{35%{filter:blur(2px);transform:translateX(8vw)}38%{transform:scaleY(.15)}42%{transform:none}}.glass{background:#eaf3ff}.glass .num{font-size:38vw;color:transparent;-webkit-text-stroke:3px #06152d;filter:drop-shadow(15px 20px 14px #4678aa88)}.glass .jp{color:#fff;text-shadow:0 0 20px #5cf,0 0 50px #28f;animation:light 4s ease-in-out infinite}@keyframes light{50%{transform:translate(22vw,45vh) rotate(90deg)}}.rain .jp{top:-45%;animation:rain 5s linear infinite}@keyframes rain{to{transform:translateY(150vh)}}.collapse{background:#111;color:#fff}.collapse .num{font-size:39vw;animation:col 3.8s steps(1) infinite}.collapse .jp{opacity:0;animation:j 3.8s steps(1) infinite}@keyframes col{66%{transform:skewX(35deg) scaleY(.12)}72%{opacity:.1}78%{transform:translateX(-25vw) scaleX(1.7)}84%{transform:none}}@keyframes j{0%,65%,84%,100%{opacity:0}66%,83%{opacity:1}}</style></head><body><header><b>117 LAB</b><span>TEST / 01</span></header><nav><button data-p="physical">PIG + TILT</button><button data-p="glitch">百十七</button><button data-p="crt">記憶</button><button data-p="glass">光</button><button data-p="rain">SIGNAL</button><button data-p="collapse">COLLAPSE</button></nav><section id="physical" class="panel on"><div class="stage"><div class="frame" id="frame"><div class="shadow"></div><div class="art"><div class="num">117</div></div></div><div class="pig">🐖</div><button class="tiltbtn" id="tilt">ENABLE PHONE TILT</button></div></section><section id="glitch" class="panel"><div class="stage glitch"><div class="num">117</div><div class="jp">百十七</div></div></section><section id="crt" class="panel"><div class="stage crt"><div class="num">117</div><div class="jp">記憶</div></div></section><section id="glass" class="panel"><div class="stage glass"><div class="num">117</div><div class="jp">光</div></div></section><section id="rain" class="panel"><div class="stage rain"><div class="num">117</div><div class="jp">信号・記憶・光・影・今・ここ・夢</div></div></section><section id="collapse" class="panel"><div class="stage collapse"><div class="num">117</div><div class="jp">百十七</div></div></section><script>document.querySelectorAll("nav button").forEach(x=>x.onclick=()=>{document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));document.getElementById(x.dataset.p).classList.add("on")});const f=document.getElementById("frame"),b=document.getElementById("tilt");let tx=0,ty=0,cx=0,cy=0,base=null;const cl=v=>Math.max(-1,Math.min(1,v));function o(e){if(e.gamma==null||e.beta==null)return;if(base===null)base=e.beta;tx=cl(e.gamma/28);ty=cl((e.beta-base)/24)}function on(){addEventListener("deviceorientation",o,true);b.textContent="TILT ON ✓"}b.onclick=async()=>{try{if(typeof DeviceOrientationEvent!="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){if(await DeviceOrientationEvent.requestPermission()==="granted")on()}else on()}catch(e){b.textContent="TILT BLOCKED"}};function loop(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;f.style.setProperty("--sx",(-cx*34)+"px");f.style.setProperty("--sy",(18-cy*28)+"px");f.style.setProperty("--shine",(-40+cx*75)+"%");f.style.transform="rotateY("+(cx*1.5)+"deg) rotateX("+(-cy*1.2)+"deg)";requestAnimationFrame(loop)}loop();</script></body></html>
