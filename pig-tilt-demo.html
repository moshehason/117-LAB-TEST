<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 Pig Tilt Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ef;font-family:monospace;overflow-x:hidden}.stage{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;perspective:1200px}.frame{width:min(70vw,420px);position:relative;transform-style:preserve-3d}.shadow{position:absolute;inset:3%;background:#000;filter:blur(22px);opacity:.28;transform:translate(var(--sx,18px),var(--sy,20px))}.art{position:relative;aspect-ratio:4/5;background:#fff;border:2px solid #111;display:grid;place-items:center;overflow:hidden}.art b{font:900 clamp(90px,25vw,180px) Arial;letter-spacing:-.1em}.art:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,#fff9 50%,transparent 60%);transform:translateX(var(--shine,-40%))}.pig{position:absolute;left:-150px;bottom:16%;font-size:82px;z-index:5;animation:run 7s linear infinite;filter:grayscale(1) contrast(2);image-rendering:pixelated}.pig.small{bottom:32%;font-size:48px;animation-delay:-3.5s}@keyframes run{to{transform:translateX(calc(100vw + 300px))}}.ui{position:absolute;bottom:20px;display:flex;gap:8px;z-index:9}button{min-height:44px;background:#fff;border:1px solid #111;padding:0 14px;font:700 11px monospace}.label{position:absolute;top:20px;font-size:11px;letter-spacing:.08em}</style></head><body><main class="stage" id="stage"><div class="label">117 / PHYSICAL LIGHT + RUNNER TEST</div><div class="frame" id="frame"><div class="shadow"></div><div class="art"><b>117</b></div></div><div class="pig">🐖</div><div class="pig small">🐖</div><div class="ui"><button id="tilt">ENABLE TILT</button><button id="reset">CENTER</button></div></main><script>const s=document.getElementById("stage"),f=document.getElementById("frame"),b=document.getElementById("tilt");let tx=0,ty=0,cx=0,cy=0,base=null;const cl=v=>Math.max(-1,Math.min(1,v));function target(x,y){tx=cl(x);ty=cl(y)}function o(e){if(e.gamma==null||e.beta==null)return;if(base===null)base=e.beta;target(e.gamma/28,(e.beta-base)/24)}function on(){addEventListener("deviceorientation",o,true);b.textContent="TILT ON"}b.onclick=async()=>{try{if(typeof DeviceOrientationEvent!="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){if(await DeviceOrientationEvent.requestPermission()==="granted")on()}else on()}catch(e){b.textContent="TILT BLOCKED"}};document.getElementById("reset").onclick=()=>{base=null;target(0,0)};s.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){const r=s.getBoundingClientRect();target(((e.clientX-r.left)/r.width-.5)*2,((e.clientY-r.top)/r.height-.5)*2)}});function loop(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;f.style.setProperty("--sx",(-cx*34)+"px");f.style.setProperty("--sy",(18-cy*28)+"px");f.style.setProperty("--shine",(-40+cx*75)+"%");f.style.transform="rotateY("+(cx*1.5)+"deg) rotateX("+(-cy*1.2)+"deg)";requestAnimationFrame(loop)}loop();</script><script src="117-audio.js?v=magic4"></script></body></html>
