<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 BACKROOMS V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}#grain,#fade{position:fixed;inset:0;pointer-events:none}#grain{z-index:4;opacity:.12;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}#fade{z-index:5;background:#000;opacity:0}</style></head><body><div id="grain"></div><div id="fade"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const s=new THREE.Scene();s.background=new THREE.Color(0x090909);s.fog=new THREE.FogExp2(0x090909,.035);const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,130),r=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.65;document.body.prepend(r.domElement);

let fl=add(new THREE.PlaneGeometry(17,120),floorM,0,0,-45);fl.rotation.x=-Math.PI/2;let ce=fl.clone();ce.position.y=4.5;ce.rotation.x=Math.PI/2;s.add(ce);
for(let z=5;z>-96;z-=5.5){let b=Math.sin(z*.12)*1.25;add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,-5+b,2.25,z);add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,5+b,2.25,z)}
for(let z=1;z>-91;z-=8){let b=Math.sin(z*.12)*1.25,L=new THREE.PointLight(0xffffff,25,15,2);L.position.set(b,3.8,z);s.add(L);add(new THREE.BoxGeometry(2.6,.07,.13),new THREE.MeshBasicMaterial({color:0xffffff}),b,4.15,z)}

const dl=add(new THREE.BoxGeometry(3.2,4.5,.25),black,-1.6,2.25,-82),dr=add(new THREE.BoxGeometry(3.2,4.5,.25),black,1.6,2.25,-82);
const altar=add(new THREE.BoxGeometry(6,.4,1.2),black,0,.2,-92);altar.visible=false;
const fire117=new THREE.Group();fire117.position.set(.45,1.55,-91);fire117.visible=false;s.add(fire117);
const fireMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.92,blending:THREE.AdditiveBlending,depthWrite:false});
function stroke(points){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const m=new THREE.Mesh(new THREE.TubeGeometry(curve,36,.18,8,false),fireMat);fire117.add(m);return m}
stroke([[-1.6,-1,0],[-1.58,0,0],[-1.55,1.35,0]]);stroke([[-.55,-1,0],[-.53,0,0],[-.5,1.35,0]]);stroke([[.35,1.3,0],[1.05,1.38,0],[1.72,1.3,0],[1.38,.75,0],[1.08,.2,0],[.75,-.45,0],[.5,-1,0]]);
const fireLight=new THREE.PointLight(0xffffff,0,13,2);fireLight.position.set(.4,2,-89.5);s.add(fireLight);const corridorLights=s.children.filter(o=>o.isPointLight&&o!==fireLight);let blackoutAt=7,blackoutUntil=0,nextFlicker=3,slowFlicker=0;
let start=performance.now(),tilt=0,drag=0,down=false,px=0;addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/45,-1,1)},{passive:true});addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){drag+=(e.clientX-px)*.002;px=e.clientX}});
const E=(a,b,t)=>{t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)};
function loop(n){requestAnimationFrame(loop);let t=(n-start)/1000,z=t<16?5-E(0,16,t)*78:-73-E(16,19,t)*5.5,b=Math.sin(z*.12)*1.1;c.position.set(c.position.x+(b+tilt*.35+drag-c.position.x)*.05,1.65+Math.sin(t*8)*.022,z);c.rotation.y+=(-Math.sin(z*.12)*.12-tilt*.06-drag*.2-c.rotation.y)*.05;if(t>16){let q=E(16,18,t);dl.position.x=-1.6-q*2.7;dr.position.x=1.6+q*2.7}if(t>18){fire117.visible=altar.visible=true}if(fire117.visible){const q=1+Math.sin(t*5)*.055;fire117.scale.set(q,1+Math.sin(t*7)*.08,q);fireLight.intensity=10+Math.sin(t*11)*3}if(t>=blackoutAt){blackoutUntil=t+.8;blackoutAt=t+6.5+Math.random()}if(t>=nextFlicker){slowFlicker=t+.35;nextFlicker=t+3+Math.random()*5}const darkNow=t<blackoutUntil;corridorLights.forEach(L=>L.intensity=darkNow?0:(t<slowFlicker?8:25));s.children.filter(o=>o.isHemisphereLight).forEach(L=>L.intensity=darkNow?0:1.05);if(t>28)document.querySelector('#fade').style.opacity=E(28,29.5,t);if(t>30.5){start=n;dl.position.x=-1.6;dr.position.x=1.6;fire117.visible=altar.visible=false;fireLight.intensity=0;document.querySelector('#fade').style.opacity=0}r.render(s,c)}
