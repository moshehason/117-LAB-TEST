<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 BACKROOMS V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}#grain,#fade{position:fixed;inset:0;pointer-events:none}#grain{z-index:4;opacity:.12;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}#fade{z-index:5;background:#000;opacity:0}</style></head><body><div id="grain"></div><div id="fade"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const s=new THREE.Scene();s.background=new THREE.Color(0x090909);s.fog=new THREE.FogExp2(0x090909,.035);const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,130),r=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.65;document.body.prepend(r.domElement);

function add(g,m,x=0,y=0,z=0){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);s.add(o);return o}
let fl=add(new THREE.PlaneGeometry(17,120),floorM,0,0,-45);fl.rotation.x=-Math.PI/2;let ce=fl.clone();ce.position.y=4.5;ce.rotation.x=Math.PI/2;s.add(ce);
for(let z=5;z>-96;z-=5.5){let b=Math.sin(z*.12)*1.25;add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,-5+b,2.25,z);add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,5+b,2.25,z)}
for(let z=1;z>-91;z-=8){let b=Math.sin(z*.12)*1.25,L=new THREE.PointLight(0xffffff,25,15,2);L.position.set(b,3.8,z);s.add(L);add(new THREE.BoxGeometry(2.6,.07,.13),new THREE.MeshBasicMaterial({color:0xffffff}),b,4.15,z)}
s.add(new THREE.HemisphereLight(0xffffff,0x111111,1.05));
const dl=add(new THREE.BoxGeometry(3.2,4.5,.25),black,-1.6,2.25,-82),dr=add(new THREE.BoxGeometry(3.2,4.5,.25),black,1.6,2.25,-82);
const altar=add(new THREE.BoxGeometry(6,.4,1.2),black,0,.2,-92);altar.visible=false;
const fire117=new THREE.Group();fire117.position.set(.42,1.55,-91);fire117.visible=false;s.add(fire117);
const fireCanvas=document.createElement('canvas');fireCanvas.width=256;fireCanvas.height=512;const fc=fireCanvas.getContext('2d');
function flameTex(time){const w=256,h=512,img=fc.createImageData(w,h),d=img.data;for(let y=0;y<h;y++){const yy=1-y/h;for(let x=0;x<w;x++){const nx=(x-w/2)/(w/2),n=Math.sin(x*.11+y*.037+time*7)+Math.sin(x*.043-y*.071-time*4);const core=1-Math.abs(nx)*(1.2+yy*1.5);let a=Math.max(0,core*(1-yy*.45)+(n*.10)-yy*.18);const i=(y*w+x)*4;d[i]=255;d[i+1]=Math.max(40,205-y*.28);d[i+2]=Math.max(0,65-y*.11);d[i+3]=Math.min(255,a*310)}}fc.putImageData(img,0,0)}
const ft=new THREE.CanvasTexture(fireCanvas);ft.colorSpace=THREE.SRGBColorSpace;
const fm=new THREE.MeshBasicMaterial({map:ft,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
function digitSprite(x,scaleX=1){const g=new THREE.Group();for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.72*scaleX,2.8),fm);m.position.set(x+(Math.random()-.5)*.12,(Math.random()-.5)*.18,(Math.random()-.5)*.18);m.scale.set(.72+Math.random()*.35,.85+Math.random()*.35,1);g.add(m)}fire117.add(g);return g}
const f1=digitSprite(-1.35,.58),f2=digitSprite(-.35,.58);
const f7=new THREE.Group();fire117.add(f7);for(let i=0;i<7;i++){let m=new THREE.Mesh(new THREE.PlaneGeometry(.72,2.8),fm);m.position.set(.72+i*.17,1.0+(Math.random()-.5)*.12,(Math.random()-.5)*.15);m.scale.set(.55,.28,1);m.rotation.z=Math.PI/2;f7.add(m)}for(let i=0;i<9;i++){let m=new THREE.Mesh(new THREE.PlaneGeometry(.7,2.7),fm);m.position.set(1.35-i*.055,.45-i*.18,(Math.random()-.5)*.15);m.scale.set(.55,.27,1);m.rotation.z=-.30;f7.add(m)}
const fireLight=new THREE.PointLight(0xffaa55,0,14,2);fireLight.position.set(.4,2,-89.5);s.add(fireLight);
const corridorLights=s.children.filter(o=>o.isPointLight&&o!==fireLight);let blackoutAt=7,blackoutUntil=0,nextFlicker=2.5,slowFlicker=0;

function unlockFire(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();const len=audioCtx.sampleRate*3,b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),a=b.getChannelData(0);let lp=0;for(let i=0;i<len;i++){lp=lp*.985+(Math.random()*2-1)*.015;a[i]=lp*(.25+Math.random()*.3)}fireSrc=audioCtx.createBufferSource();fireSrc.buffer=b;fireSrc.loop=true;const filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=650;filt.Q.value=.55;fireGain=audioCtx.createGain();fireGain.gain.value=0;fireSrc.connect(filt).connect(fireGain).connect(audioCtx.destination);fireSrc.start()}
addEventListener('pointerdown',unlockFire,{once:true,passive:true});
let start=performance.now(),tilt=0,drag=0,down=false,px=0;addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/45,-1,1)},{passive:true});addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){drag+=(e.clientX-px)*.002;px=e.clientX}});
const E=(a,b,t)=>{t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)};
function loop(n){requestAnimationFrame(loop);let t=(n-start)/1000,z=t<16?5-E(0,16,t)*78:-73-E(16,19,t)*5.5,b=Math.sin(z*.12)*1.1;c.position.set(c.position.x+(b+tilt*.35+drag-c.position.x)*.05,1.65+Math.sin(t*8)*.022,z);c.rotation.y+=(-Math.sin(z*.12)*.12-tilt*.06-drag*.2-c.rotation.y)*.05;
if(t>16){let q=E(16,18,t);dl.position.x=-1.6-q*2.7;dr.position.x=1.6+q*2.7}if(t>18){fire117.visible=altar.visible=true}
flameTex(t);ft.needsUpdate=true;if(fire117.visible){const pulse=1+Math.sin(t*7)*.045;fire117.scale.set(pulse,1+Math.sin(t*5)*.06,pulse);fire117.children.forEach((g,j)=>g.children&&g.children.forEach((m,i)=>{m.position.y+=Math.sin(t*6+i*1.7+j)*.0018}));fireLight.intensity=12+Math.sin(t*13)*3+Math.random()*2}
if(t>=blackoutAt){blackoutUntil=t+.75+Math.random()*.4;blackoutAt=t+6.4+Math.random()*1.2}if(t>=nextFlicker){slowFlicker=t+.2+Math.random()*.5;nextFlicker=t+2.8+Math.random()*5.5}const totalDark=t<blackoutUntil;corridorLights.forEach(L=>L.intensity=totalDark?0:(t<slowFlicker&&Math.random()<.35?5:25));s.children.filter(o=>o.isHemisphereLight).forEach(L=>L.intensity=totalDark?0:1.05);if(totalDark&&fire117.visible)fireLight.intensity=15;
if(fireGain){const proximity=Math.max(0,Math.min(1,(c.position.z+55)/-35));fireGain.gain.setTargetAtTime(.008+proximity*.16,audioCtx.currentTime,.25)}
if(t>28)document.querySelector('#fade').style.opacity=E(28,29.5,t);if(t>30.5){start=n;dl.position.x=-1.6;dr.position.x=1.6;fire117.visible=altar.visible=false;fireLight.intensity=0;document.querySelector('#fade').style.opacity=0}r.render(s,c)}
requestAnimationFrame(loop);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
