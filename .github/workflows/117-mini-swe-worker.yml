name: 117 mini-SWE Worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: Explicit task for mini-SWE-agent
        required: true
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: 117-mini-swe
  cancel-in-progress: false

jobs:
  mini_swe:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 3 && github.actor == 'moshehason' && contains(github.event.comment.body, '[117-TASK]') && contains(github.event.comment.body, 'mini-swe')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare task
        id: task
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${{ github.event.comment.id }}" --jq '.body' > /tmp/117-task.txt
            echo "source_id=${{ github.event.comment.id }}" >> "${GITHUB_OUTPUT}"
          else
            printf '%s' "${MANUAL_TASK}" > /tmp/117-task.txt
            echo "source_id=manual-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure free backend
        id: cfg
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_VAR: ${{ vars.MINI_SWE_MODEL }}
        run: |
          set -euo pipefail
          MODEL="${MODEL_VAR:-openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}"
          echo "model=${MODEL}" >> "${GITHUB_OUTPUT}"
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            if [ "${{ github.event_name }}" = "issue_comment" ]; then
              printf -v BODY '%s\n' '[117-RESULT]' 'agent: mini-swe' "task: ${{ steps.task.outputs.source_id }}" 'status: BLOCKED' "model: ${MODEL}" 'blocker: OPENROUTER_API_KEY secret is missing; no model call was made.'
              gh api "repos/${GITHUB_REPOSITORY}/issues/3/comments" -f body="${BODY}"
            fi
            exit 0
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mini-SWE-agent
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        run: python -m pip install --upgrade mini-swe-agent

      - name: Create worker branch
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="agent/mini-swe-${{ steps.task.outputs.source_id }}"
          git switch -c "${BRANCH}"
          echo "name=${BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Run mini-SWE-agent
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        id: agent
        continue-on-error: true
        shell: bash
        env:
          MSWEA_MODEL_NAME: ${{ steps.cfg.outputs.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo "You are mini-SWE-agent working for the 117 AI TEAM."
            echo "Work only in this checkout and only on the explicit task below."
            echo "Do not push, merge, create a PR, alter repository settings, touch secrets, or contact external people."
            echo "Do not switch branches."
            echo "Preserve existing LAB experiments."
            echo "Make the smallest safe change only if needed, run relevant checks, and leave changes in the working tree."
            echo "If the task targets TOMO, stop because production is not accessible from this LAB repository."
            echo
            echo "USER TASK:"
            cat /tmp/117-task.txt
          } > /tmp/117-agent-task.txt
          mini -y -m "${MSWEA_MODEL_NAME}" -t "$(cat /tmp/117-agent-task.txt)" 2>&1 | tee /tmp/117-mini-swe.log

      - name: Package changes
        if: ${{ steps.cfg.outputs.ready == 'true' && always() }}
        id: result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "117 mini-SWE"
          git config user.email "actions@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "mini-SWE: task ${{ steps.task.outputs.source_id }}"
          fi

          AHEAD="$(git rev-list --count origin/main..HEAD)"
          if [ "${AHEAD}" -eq 0 ]; then
            echo "status=NO_CHANGES" >> "${GITHUB_OUTPUT}"
            echo "pr=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh auth setup-git
          git push -u origin "${{ steps.branch.outputs.name }}"
          PR_URL="$(gh pr create --base main --head "${{ steps.branch.outputs.name }}" --title "mini-SWE: task ${{ steps.task.outputs.source_id }}" --body "Automated mini-SWE-agent result. Independent review required before merge." || true)"
          echo "status=READY_FOR_REVIEW" >> "${GITHUB_OUTPUT}"
          echo "pr=${PR_URL}" >> "${GITHUB_OUTPUT}"

      - name: Report
        if: ${{ steps.cfg.outputs.ready == 'true' && github.event_name == 'issue_comment' && always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf -v BODY '%s\n' '[117-RESULT]' 'agent: mini-swe' "task: ${{ steps.task.outputs.source_id }}" "status: ${{ steps.result.outputs.status }}" "model: ${{ steps.cfg.outputs.model }}" "branch: ${{ steps.branch.outputs.name }}" "pr: ${{ steps.result.outputs.pr }}" "worker_outcome: ${{ steps.agent.outcome }}" 'review_required: true'
          gh api "repos/${GITHUB_REPOSITORY}/issues/3/comments" -f body="${BODY}"
