name: Publish 117 Story Delivery

on:
  push:
    paths:
      - ".github/workflows/publish-117-story-delivery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify MP4
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/story-2026-10-09.mp4
          for part in $(find .delivery-inbox/2026-10-09 -type f -name 'part-*.b64' | sort); do
            base64 --decode "$part" >> /tmp/story-2026-10-09.mp4
          done
          echo "66548f993c41add6d82a514ba01038517c1353aefa5245d7d9400a750f71af78  /tmp/story-2026-10-09.mp4" | sha256sum --check
          test "$(stat -c %s /tmp/story-2026-10-09.mp4)" = "2372332"

      - name: Publish to story-delivery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "117 Story Delivery"
          git config user.email "actions@users.noreply.github.com"
          git switch story-delivery
          mkdir -p story
          cp /tmp/story-2026-10-09.mp4 story/2026-10-09.mp4
          cat > story/2026-10-09.json <<'JSON'
          {
            "date": "2026-10-09",
            "asset_id": "story-2026-10-09-tension-score",
            "concept": "Tension Score 117 — a field of black kinetic strings bends through a fully readable 117 and settles into a clean gallery mark.",
            "generator": "Codex + Remotion 4.0.534, local procedural render",
            "final_sha256": "66548f993c41add6d82a514ba01038517c1353aefa5245d7d9400a750f71af78",
            "size_bytes": 2372332,
            "video": {
              "codec": "h264",
              "profile": "High",
              "pixel_format": "yuv420p",
              "width": 1080,
              "height": 1920,
              "fps": 30,
              "duration_seconds": 12
            },
            "audio": {
              "codec": "aac",
              "profile": "LC",
              "sample_rate": 48000,
              "channels": 2,
              "layout": "stereo",
              "integrated_loudness_lufs": -15.9,
              "mean_db": -17.2,
              "peak_db": -4.5,
              "source": "Original procedural synthesis: brown-noise tension bed, 58.5/117 Hz drones and filtered impulses",
              "license": "Original work created for 117; no third-party audio"
            },
            "qa": {
              "full_decode": "PASS",
              "visual_frames": "PASS — 117 complete, centered and readable at 0.5s, 4s, 8s and 11.5s",
              "faststart": true,
              "safe_for_story": true
            },
            "publication_state": "READY_NOT_POSTED"
          }
          JSON
          git add story/2026-10-09.mp4 story/2026-10-09.json
          git commit -m "Deliver 117 Story for 2026-10-09"
          git push origin story-delivery
