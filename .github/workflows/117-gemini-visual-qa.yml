name: 117 Gemini Visual QA

# Automated visual QA via Gemini API.
# Requires repo secret: GEMINI_API_KEY
# Posts results to Issue #3. LAB-TEST only — not production.

on:
  push:
    paths:
      - "117-*.html"
      - "demo.html"
      - ".github/workflows/117-gemini-visual-qa.yml"
  schedule:
    # Every 6 hours (aligned with autonomous studio)
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      experiment:
        description: "Optional single experiment file (e.g. 117-liquid-drift.html). Empty = default set."
        required: false
        type: string

concurrency:
  group: 117-gemini-visual-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  WORKROOM_ISSUE: "3"
  LAB_BASE: "https://moshehason.github.io/117-LAB-TEST"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check API key
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::Missing secret GEMINI_API_KEY. Add it under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Screenshot + Gemini QA
        id: qa
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const https = require('https');

          const LAB_BASE = process.env.LAB_BASE;
          const KEY = process.env.GEMINI_API_KEY;
          // Prefer widely available Flash models on free tier
          const MODEL = process.env.GEMINI_MODEL || 'gemini-3.8-flash';
          const single = (process.env.INPUT_EXPERIMENT || '').trim();

          const DEFAULTS = [
            '117-liquid-drift.html',
            '117-breath.html',
            '117-time-cut.html',
            '117-float.html',
            '117-tvtv.html',
            '117-clean-chaos.html',
            '117-liquid-glass.html',
            '117-prism-orbit.html',
            '117-mercury-bloom.html',
            '117-ribbon-cut.html',
            '117-ghost-type.html',
            '117-organic-ink.html',
            '117-metal-cube.html',
            '117-chrome-object.html',
            '117-breathing-chrome.html',
            '117-pink-gel.html',
            '117-liquid-float.html',
            '117-material-beast.html',
            '117-wolf-fur.html',
            '117-reaction-diffusion.html',
            '117-nabla-black-burst.html',
            '117-worm-tardigrade-softbody.html',
            '117-fluid-particle.html',
            '117-fluid-glass.html',
            '117-soft-rubber-organism.html',
          ];
          const targets = single ? [single] : DEFAULTS;

          // Built as an array joined with '\n' (not a multi-line template
          // literal) so every physical line stays indented inside this
          // YAML `run: |` block -- a raw template literal's un-indented
          // continuation lines dedent below the block scalar's established
          // indentation, which breaks YAML parsing before any job can even
          // start (that's what was emailing a failure notice on every push).
          const PROMPT = [
            'You are Gemini on the 117 AI TEAM. Visual QA only.',
            '117 is experimental digital art on a white gallery background, mobile-first (iPhone).',
            'Check this screenshot of a LAB experiment:',
            '1) Background truly transparent or clean white gallery (no accidental full-frame opaque matte that looks wrong)?',
            '2) Is the 117 mark fully visible and not clipped?',
            '3) Any cheap glow, blue halo, or soft fringe around edges?',
            '4) Unwanted captions/UI chrome on the artwork?',
            '5) Obvious mobile layout problems?',
            '6) Is 117 immediately readable as 117, with strong form and no confusing font distortion?',
            '7) Does it feel crisp, intentional and gallery-grade rather than cheap, generic or AI-looking?',
            '8) Across the supplied time-separated frames, is motion visually alive and consistent (not frozen, popping, clipped or unexpectedly changing background)?',
            '9) Are transparent edges clean with no matte/fringe/halo contamination?',
            '',
            'Reply in EXACTLY this format (English):',
            'STATUS: PASS or FAIL',
            'EXPERIMENT: <filename>',
            'ISSUES:',
            '- item',
            '- item',
            'If no issues: ISSUES:\n- None',
          ].join('\n');

          function gemini(frames, experiment) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify({
                contents: [{
                  parts: [
                    { text: PROMPT + '\n\nExperiment file: ' + experiment + '\nFrames are chronological: early, middle, later.' },
                    ...frames.map(data => ({ inline_data: { mime_type: 'image/png', data } }))
                  ]
                }],
                generationConfig: { temperature: 0.2, maxOutputTokens: 512 }
              });
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY}`;
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname + u.search,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body)
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`Gemini HTTP ${res.statusCode}: ${data.slice(0, 500)}`));
                    return;
                  }
                  try {
                    const j = JSON.parse(data);
                    const text = j.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || JSON.stringify(j).slice(0, 400);
                    resolve(text.trim());
                  } catch (e) {
                    reject(e);
                  }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2
            });
            const reports = [];

            for (const file of targets) {
              const url = `${LAB_BASE}/${file}`;
              console.log('Open', url);
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
                const frames = [];
                for (const [i, delay] of [800, 2000, 2700].entries()) {
                  await page.waitForTimeout(delay);
                  const buf = await page.screenshot({ type: 'png', fullPage: false });
                  frames.push(buf.toString('base64'));
                  fs.writeFileSync(`${file}.frame-${i + 1}.png`, buf);
                }
                let answer;
                try {
                  answer = await gemini(frames, file);
                } catch (e) {
                  answer = `STATUS: ERROR\nEXPERIMENT: ${file}\nISSUES:\n- Gemini API: ${String(e.message || e).slice(0, 300)}`;
                }
                reports.push({ file, answer });
                console.log('---', file, '---\n', answer);
              } catch (e) {
                reports.push({
                  file,
                  answer: `STATUS: ERROR\nEXPERIMENT: ${file}\nISSUES:\n- Screenshot/load: ${String(e.message || e).slice(0, 300)}`
                });
              }
            }

            await browser.close();
            fs.writeFileSync('gemini-qa-report.json', JSON.stringify(reports, null, 2));
            const md = reports.map(r => `### ${r.file}\n\n${r.answer}\n`).join('\n');
            fs.writeFileSync('gemini-qa-report.md', md);
          })().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE
        env:
          INPUT_EXPERIMENT: ${{ github.event.inputs.experiment }}

      - name: Post report to Issue #3
        if: always()
        run: |
          set -euo pipefail
          # Each BODY is built as adjacent quoted segments joined by $'\n'
          # literals on a single physical line, rather than a quoted string
          # with real embedded newlines -- the latter dedents below this
          # YAML `run: |` block's indentation and breaks parsing before any
          # job can even start (same root cause as the fix in the previous
          # step's PROMPT constant; see its comment for the full story).
          if [ ! -f gemini-qa-report.md ]; then
            BODY="[GEMINI → 117 AI TEAM]"$'\n\n'"STATUS: ERROR"$'\n\n'"No report file produced. Check workflow logs."$'\n\n'"[117-AUTO]"
          else
            REPORT=$(cat gemini-qa-report.md)
            BODY="[GEMINI → 117 AI TEAM]"$'\n\n'"Automated visual QA (iPhone 390×844 viewport)."$'\n'"Source: GitHub Actions + Gemini API."$'\n'"LAB only — not production."$'\n\n'"${REPORT}"$'\n\n'"Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n'"[117-AUTO]"
          fi
          # GitHub issue comment body limit safety
          BODY=$(printf '%s' "$BODY" | head -c 55000)
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/comment.json
          gh api "repos/${{ github.repository }}/issues/${WORKROOM_ISSUE}/comments" --input /tmp/comment.json
