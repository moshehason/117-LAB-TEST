const c=document.getElementById('c'),g=c.getContext('2d'),btn={classList:{add(){}}};let AC=null;function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}function beep(freq,dur=.045,type='square',vol=.055){if(!AC)return;const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime);v.gain.setValueAtTime(vol,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}function hitSound(kind){const tones={wall:220,paddle:440,edge:520};beep(tones[kind]||300,kind==='paddle'?.075:.045,'square',.07)}function goalSound(){beep(700,.18,'square',.075)}let W,H,D=Math.min(devicePixelRatio||1,2),player=.5,ai=.5,target=.5,base=null,last=performance.now(),score=[0,0],flash=0,flashHue=190,trail=[],hitType=0;let ball={x:.5,y:.5,vx:.0046,vy:.0031};

function numeral(txt,x,y,size,hue){g.save();g.font=`900 ${size}px Impact,Arial Black,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.shadowColor='transparent';g.shadowBlur=0;g.fillStyle='#000';g.fillText(txt,x,y);g.restore()}

function frame(t){let dt=Math.min(2,(t-last)/16.67);last=t;player+=(target-player)*.13;
let aim=.5;if(ball.vx>0){let tm=(.90-ball.x)/Math.max(ball.vx,.0001),p=ball.y+ball.vy*tm;while(p<.08||p>.92){if(p<.08)p=.16-p;if(p>.92)p=1.84-p}aim=p+Math.sin(t*.0017)*.014}else aim=.5+Math.sin(t*.0007)*.04;ai+=Math.max(-.009*dt,Math.min(.009*dt,(aim-ai)*.085));ai=Math.max(.13,Math.min(.87,ai));
