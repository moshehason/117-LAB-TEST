<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 PONG</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#000;font-family:monospace;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:3px solid #000;background:#fff;color:#000;padding:12px 18px;font:900 13px monospace;letter-spacing:.08em}#msg{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:900 12px monospace;letter-spacing:.12em}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="msg">117 PONG / TILT TO PLAY</div><button id="tilt">ENABLE TILT</button></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),btn=document.getElementById('tilt');let W,H,dpr=Math.min(devicePixelRatio||1,2),p1=.5,p2=.5,target=.5,ball={x:.5,y:.5,vx:.0045,vy:.0032},s1=0,s2=0,base=null,last=performance.now();
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function orient(e){if(e.beta==null)return;if(base===null)base=e.beta;target=Math.max(.12,Math.min(.88,.5+(e.beta-base)/70))}
function enable(){addEventListener('deviceorientation',orient,true);btn.textContent='TILT ON ✓';setTimeout(()=>btn.style.opacity=.25,900)}
btn.onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){if(await DeviceOrientationEvent.requestPermission()==='granted')enable()}else enable()}catch(e){btn.textContent='TILT BLOCKED'}};
addEventListener('pointermove',e=>target=Math.max(.12,Math.min(.88,e.clientY/H)));
function reset(dir){ball.x=.5;ball.y=.5;ball.vx=.0045*dir;ball.vy=(Math.random()*.004-.002)}
function drawOne(px,py,h){x.fillStyle='#000';const w=Math.max(16,W*.036),cap=w*1.15;x.fillRect(px,py-h/2,w,h);x.fillRect(px-cap,py-h/2,cap+w,w*1.15)}
function drawSeven(px,py,h){x.fillStyle='#000';const w=Math.max(16,W*.036),cap=w*2.5;x.fillRect(px-cap,py-h/2,cap+w,w*1.15);x.beginPath();x.moveTo(px+w,py-h/2+w);x.lineTo(px+w,py+h/2);x.lineTo(px-w*.15,py+h/2);x.lineTo(px+w*.15,py-h/2+w);x.closePath();x.fill()}
function drawBall(){x.fillStyle='#000';const fs=Math.max(30,Math.min(W,H)*.082);x.font='900 '+fs+'px Arial Black,Impact,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('1',ball.x*W,ball.y*H)}
function loop(t){let dt=Math.min(2,(t-last)/16.67);last=t;p1+=(target-p1)*.12;const aiReaction=.075,aiMax=.0085;let aim=.5;if(ball.vx>0){const time=(.90-ball.x)/Math.max(ball.vx,.0001);let predicted=ball.y+ball.vy*time;while(predicted<.08||predicted>.92){if(predicted<.08)predicted=.16-predicted;if(predicted>.92)predicted=1.84-predicted}aim=predicted+(Math.sin(t*.0017)*.018);}else{aim=.5+Math.sin(t*.0008)*.05;}const delta=Math.max(-aiMax*dt,Math.min(aiMax*dt,(aim-p2)*aiReaction));p2=Math.max(.12,Math.min(.88,p2+delta));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y<.08||ball.y>.92){ball.vy*=-1;ball.y=Math.max(.08,Math.min(.92,ball.y))}
const ph=Math.min(H*.20,170),lx=W*.075,rx=W*.925,pad=ph/H/2;if(ball.vx<0&&ball.x<.11&&ball.x>.055&&Math.abs(ball.y-p1)<pad){ball.vx=Math.abs(ball.vx)*1.035;ball.vy+=(ball.y-p1)*.004}if(ball.vx>0&&ball.x>.89&&ball.x<.945&&Math.abs(ball.y-p2)<pad){ball.vx=-Math.abs(ball.vx)*1.035;ball.vy+=(ball.y-p2)*.004}if(ball.x<-.03){s2++;reset(1)}if(ball.x>1.03){s1++;reset(-1)}
x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';for(let y=H*.16;y<H*.88;y+=28)x.fillRect(W/2-2,y,4,14);x.font='900 '+Math.max(28,W*.075)+'px monospace';x.textAlign='center';x.fillText(s1,W*.25,H*.12);x.fillText(s2,W*.75,H*.12);drawOne(lx,p1*H,ph);drawSeven(rx,p2*H,ph);drawBall();x.font='900 '+Math.max(11,W*.028)+'px monospace';x.textAlign='left';x.fillText('117 PONG',20,H-25);x.textAlign='right';x.fillText('TILT TO PLAY',W-20,H-25);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
