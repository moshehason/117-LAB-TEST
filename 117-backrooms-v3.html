<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 BACKROOMS V3</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}#grain,#fade{position:fixed;inset:0;pointer-events:none}#grain{z-index:4;opacity:.12;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}#fade{z-index:5;background:#000;opacity:0}</style></head><body><div id="grain"></div><div id="fade"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const s=new THREE.Scene();s.background=new THREE.Color(0x090909);s.fog=new THREE.FogExp2(0x090909,.035);const c=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,130),r=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(innerWidth,innerHeight);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.65;document.body.prepend(r.domElement);
const wall=new THREE.MeshStandardMaterial({color:0x777777,roughness:.95}),floorM=new THREE.MeshStandardMaterial({color:0x292929,roughness:.82,metalness:.12}),skin=new THREE.MeshStandardMaterial({color:0xb9b9b9,roughness:.72}),black=new THREE.MeshStandardMaterial({color:0x151515,roughness:1});
function add(g,m,x=0,y=0,z=0){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);s.add(o);return o}
let fl=add(new THREE.PlaneGeometry(17,120),floorM,0,0,-45);fl.rotation.x=-Math.PI/2;let ce=fl.clone();ce.position.y=4.5;ce.rotation.x=Math.PI/2;s.add(ce);
for(let z=5;z>-96;z-=5.5){let b=Math.sin(z*.12)*1.25;add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,-5+b,2.25,z);add(new THREE.BoxGeometry(1.2,4.5,5.3),wall,5+b,2.25,z)}
for(let z=1;z>-91;z-=8){let b=Math.sin(z*.12)*1.25,L=new THREE.PointLight(0xffffff,25,15,2);L.position.set(b,3.8,z);s.add(L);add(new THREE.BoxGeometry(2.6,.07,.13),new THREE.MeshBasicMaterial({color:0xffffff}),b,4.15,z)}
s.add(new THREE.HemisphereLight(0xffffff,0x111111,1.05));
const dl=add(new THREE.BoxGeometry(3.2,4.5,.25),black,-1.6,2.25,-82),dr=add(new THREE.BoxGeometry(3.2,4.5,.25),black,1.6,2.25,-82);
function person(){let g=new THREE.Group(),tor=new THREE.Mesh(new THREE.CapsuleGeometry(.25,1.65,5,8),skin),head=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),skin);tor.position.y=1.55;head.position.y=2.72;head.scale.set(.78,1.15,.82);g.add(tor,head);for(let q of [-1,1]){let a=new THREE.Mesh(new THREE.CapsuleGeometry(.075,1.75,4,7),skin);a.position.set(q*.35,1.48,0);g.add(a);let l=new THREE.Mesh(new THREE.CapsuleGeometry(.09,1.7,4,7),skin);l.position.set(q*.15,.25,0);g.add(l)}s.add(g);return g}
const oneA=person(),oneB=person(),seven=person();[oneA,oneB,seven].forEach(o=>o.visible=false);oneA.position.set(-1.45,0,-91);oneB.position.set(0,0,-91);seven.position.set(1.55,0,-91);
const altar=add(new THREE.BoxGeometry(6,.4,1.2),black,0,.2,-92);altar.visible=false;
let start=performance.now(),tilt=0,drag=0,down=false,px=0;addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/45,-1,1)},{passive:true});addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){drag+=(e.clientX-px)*.002;px=e.clientX}});
const E=(a,b,t)=>{t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)};
function loop(n){requestAnimationFrame(loop);let t=(n-start)/1000,z=t<16?5-E(0,16,t)*78:-73-E(16,19,t)*5.5,b=Math.sin(z*.12)*1.1;c.position.set(c.position.x+(b+tilt*.35+drag-c.position.x)*.05,1.65+Math.sin(t*8)*.022,z);c.rotation.y+=(-Math.sin(z*.12)*.12-tilt*.06-drag*.2-c.rotation.y)*.05;
if(t>16){let q=E(16,18,t);dl.position.x=-1.6-q*2.7;dr.position.x=1.6+q*2.7}if(t>18){oneA.visible=oneB.visible=seven.visible=altar.visible=true}
if(t>20){let q=E(20,25,t);seven.rotation.z=-q*.68;seven.position.y=q*.55;seven.children[0].rotation.z=q*.8;seven.children[1].position.x=-q*.45;seven.children[1].position.y=2.72+q*.35;seven.children[2].rotation.z=-q*1.5;seven.children[2].position.x=-.35-q*.3;seven.children[3].rotation.z=-q*1.15;seven.children[3].position.x=.35+q*.45;seven.children[4].rotation.z=q*.75;seven.children[5].rotation.z=q*.75}
if(t>25){oneA.rotation.z=Math.sin(t*2)*.008;oneB.rotation.z=Math.sin(t*2+1)*.008;seven.rotation.z+=Math.sin(t*3)*.001}
if(t>28)document.querySelector('#fade').style.opacity=E(28,29.5,t);if(t>30.5){start=n;dl.position.x=-1.6;dr.position.x=1.6;oneA.visible=oneB.visible=seven.visible=altar.visible=false;seven.rotation.z=0;seven.position.set(1.55,0,-91);seven.children[0].rotation.z=0;seven.children[1].position.set(0,2.72,0);document.querySelector('#fade').style.opacity=0}r.render(s,c)}requestAnimationFrame(loop);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
