<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 MAZE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}canvas{width:100%;height:100%;display:block}</style></head><body><canvas></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),AC,baseB=null,last=0,score=0;
function audio(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}function tone(f,d=.035,v=.03,type='square'){try{parent!==window&&parent.postMessage({t:'117sound',f:f,d:d,v:v,w:type},'*')}catch(e){}if(!AC)return;let o=AC.createOscillator(),q=AC.createGain();o.type=type;o.frequency.value=f;q.gain.setValueAtTime(v,AC.currentTime);q.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(q);q.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function R(){W=c.width=innerWidth*D;H=c.height=innerHeight*D;g.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}R();onresize=R;
const map=["111111111111111","100000010000001","101110010111101","100000000000001","101011111010101","100010001000001","111010101011101","100000000000001","101110111011101","100010000010001","101011111010101","100000010000001","101110010111101","100000000000001","111111111111111"],N=15;
let dots=new Set;for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]=='0')dots.add(x+','+y);
let p={x:1,y:1},dir={x:1,y:0},want={x:1,y:0},ghosts=[{x:13,y:13,dx:-1,dy:0},{x:13,y:1,dx:0,dy:1},{x:1,y:13,dx:1,dy:0}];
function open(x,y){return x>=0&&y>=0&&x<N&&y<N&&map[y][x]=='0'}function choose(e){let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(a=>open(e.x+a[0],e.y+a[1])&&!(a[0]==-e.dx&&a[1]==-e.dy));let a=opts[Math.floor(Math.random()*opts.length)]||[-e.dx,-e.dy];e.dx=a[0];e.dy=a[1]}
function tilt(e){if(e.beta==null)return;if(baseB===null)baseB=e.beta;let x=e.gamma/9,y=(e.beta-baseB)/9;if(Math.abs(x)>Math.abs(y)&&Math.abs(x)>.38)want={x:Math.sign(x),y:0};else if(Math.abs(y)>.38)want={x:0,y:Math.sign(y)}}
if(sessionStorage.getItem('117tilt')==='1'||typeof DeviceOrientationEvent==='undefined'||typeof DeviceOrientationEvent.requestPermission!=='function')addEventListener('deviceorientation',tilt,true);
onpointerdown=e=>{let dx=e.clientX-W/2,dy=e.clientY-H/2;want=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};audio()};
function reset(){p={x:1,y:1};dir={x:1,y:0};tone(100,.12,.035)}
function step(){if(open(p.x+want.x,p.y+want.y))dir={...want};if(open(p.x+dir.x,p.y+dir.y)){p.x+=dir.x;p.y+=dir.y}let k=p.x+','+p.y;if(dots.delete(k)){score++;tone(score%2?240:285,.025,.022);if(!dots.size){tone(660,.07,.04);setTimeout(()=>tone(880,.09,.035),70);setTimeout(()=>tone(1170,.12,.03),140)}}ghosts.forEach(e=>{if(!open(e.x+e.dx,e.y+e.dy)||Math.random()<.28)choose(e);e.x+=e.dx;e.y+=e.dy;if(e.x==p.x&&e.y==p.y)reset()})}
function draw(t){if(t-last>125){last=t;step()}g.clearRect(0,0,W,H);let S=Math.min(W*.92,H*.82),z=S/N,ox=(W-S)/2,oy=(H-S)/2;g.fillStyle='#000';for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]=='1')g.fillRect(ox+x*z,oy+y*z,z,z);g.fillStyle='#000';dots.forEach(k=>{let [x,y]=k.split(',').map(Number);g.beginPath();g.arc(ox+(x+.5)*z,oy+(y+.5)*z,Math.max(1.3,z*.07),0,7);g.fill()});g.textAlign='center';g.textBaseline='middle';g.font='900 '+z*.9+'px Impact,Arial Black';g.fillText('1',ox+(p.x+.5)*z,oy+(p.y+.5)*z);g.font='900 '+z*.72+'px Impact,Arial Black';ghosts.forEach((e,i)=>g.fillText(i==0?'1':i==1?'7':'百',ox+(e.x+.5)*z,oy+(e.y+.5)*z));g.font='900 18px Impact';g.fillText('117  '+score,W/2,oy+S+28);requestAnimationFrame(draw)}requestAnimationFrame(draw);addEventListener('pointerdown',()=>audio(),{once:true});
</script></body></html>
