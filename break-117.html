<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}canvas{width:100%;height:100%}.p{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);border:3px solid #000;background:#000;color:#fff;font:900 22px Impact;padding:18px 34px;animation:b .8s steps(1) infinite}@keyframes b{50%{background:#fff;color:#000}}</style></head><body><canvas></canvas><button class=p>PLAY</button><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),P=document.querySelector('button');let W,H,p=.5,b={x:.5,y:.72,vx:.004,vy:-.006},br=[],run=0;function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();onresize=R;function reset(){br=[];for(let y=0;y<5;y++)for(let q=0;q<7;q++)br.push({x:.08+q*.13,y:.1+y*.07,on:1,n:'117'[(q+y)%3]})}reset();P.onclick=()=>{P.remove();run=1};onpointermove=e=>p=e.clientX/W;function f(){if(run){b.x+=b.vx;b.y+=b.vy;if(b.x<.02||b.x>.98)b.vx*=-1;if(b.y<.02)b.vy*=-1;if(b.y>.91&&b.y<.96&&Math.abs(b.x-p)<.13)b.vy=-Math.abs(b.vy);if(b.y>1)b={x:.5,y:.72,vx:.004,vy:-.006};br.forEach(r=>{if(r.on&&Math.abs(b.x-r.x)<.055&&Math.abs(b.y-r.y)<.035){r.on=0;b.vy*=-1}})}g.clearRect(0,0,W,H);g.fillStyle='#000';g.font='900 '+Math.min(W*.08,50)+'px Impact';g.textAlign='center';br.forEach(r=>r.on&&g.fillText(r.n,r.x*W,r.y*H));g.fillRect((p-.12)*W,.93*H,.24*W,8);g.font='900 '+Math.min(W*.09,48)+'px Impact';g.fillText('1',b.x*W,b.y*H);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
