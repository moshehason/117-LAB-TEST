<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 FIRE ENGINE TEST</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505}canvas{display:block}#status{position:fixed;left:12px;bottom:12px;color:#aaa;font:11px monospace;z-index:2}</style></head><body><div id="status">loading volumetric fire…</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
import {VolumetricFire} from 'https://cdn.jsdelivr.net/gh/housz/ThreeVolumetricFire@main/src/ThreeVolumetricFire.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,50);camera.position.set(0,1.5,7);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const loader=new THREE.TextureLoader();const noise=await loader.loadAsync('https://cdn.jsdelivr.net/gh/housz/ThreeVolumetricFire@main/examples/assets/nzw.png');const profile=await loader.loadAsync('https://cdn.jsdelivr.net/gh/housz/ThreeVolumetricFire@main/examples/assets/firetex.png');[noise,profile].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.minFilter=t.magFilter=THREE.LinearFilter});profile.wrapS=profile.wrapT=THREE.ClampToEdgeWrapping;
const group=new THREE.Group();group.position.x=.35;scene.add(group);const fires=[];
function fire(w,h,x,y){const f=new VolumetricFire({camera,textureNoise:noise,textureProfile:profile,width:w,height:h,depth:.65,sliceSpacing:.18,segments:22});f.position.set(x,y,0);group.add(f);fires.push(f);return f}
fire(.48,3,-1.25,0);fire(.48,3,-.35,0);const seven=fire(.55,3.2,.95,0);seven.setControlPoints([{pos:new THREE.Vector3(-.55,3,0),scale:new THREE.Vector3(1.25,1,1),rot:new THREE.Quaternion()},{pos:new THREE.Vector3(.55,3,0),scale:new THREE.Vector3(1.2,1,1),rot:new THREE.Quaternion()},{pos:new THREE.Vector3(.35,2.35,0),scale:new THREE.Vector3(.8,1,1),rot:new THREE.Quaternion()},{pos:new THREE.Vector3(.05,1.35,0),scale:new THREE.Vector3(.65,1,1),rot:new THREE.Quaternion()},{pos:new THREE.Vector3(-.25,.15,0),scale:new THREE.Vector3(.55,1,1),rot:new THREE.Quaternion()}]);
document.querySelector('#status').textContent='ThreeVolumetricFire • mobile test';
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();fires.forEach(f=>f.update(t));group.rotation.y=Math.sin(t*.35)*.08;renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
