<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}canvas{width:100%;height:100%}.p{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);border:3px solid #000;background:#000;color:#fff;font:900 22px Impact;padding:18px 34px;animation:b .8s steps(1) infinite}@keyframes b{50%{background:#fff;color:#000}}</style></head><body><canvas></canvas><button class=p>PLAY</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),P=document.querySelector('button');let W,H,s=[],d=[1,0],food={},run=0,last=0,AC,baseB=null;
function audio(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let z=AC.createOscillator(),q=AC.createGain();q.gain.value=.0001;z.connect(q);q.connect(AC.destination);z.start();z.stop(AC.currentTime+.01)}function tone(f,d=.05){if(!AC)return;let o=AC.createOscillator(),v=AC.createGain();o.type='square';o.frequency.value=f;v.gain.setValueAtTime(.045,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
const words=[['games','en-US'],['juegos','es-ES'],['jeux','fr-FR'],['Spiele','de-DE'],['giochi','it-IT'],['משחקים','he-IL'],['игры','ru-RU'],['ゲーム','ja-JP']];function say(){let q=words[Math.floor(Math.random()*words.length)],u=new SpeechSynthesisUtterance(q[0]);u.lang=q[1];u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();onresize=R;function reset(){s=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];d=[1,0];food={x:15,y:10}}
function tilt(e){if(e.beta==null)return;if(baseB===null)baseB=e.beta;let x=e.gamma/10,y=(e.beta-baseB)/10;if(Math.abs(x)>Math.abs(y)&&Math.abs(x)>.35){let nd=[Math.sign(x),0];if(nd[0]!==-d[0])d=nd}else if(Math.abs(y)>.35){let nd=[0,Math.sign(y)];if(nd[1]!==-d[1])d=nd}}async function start(){audio();tone(220,.06);setTimeout(()=>tone(440,.07),70);setTimeout(()=>say(),170);let ok=true;try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')ok=(await DeviceOrientationEvent.requestPermission())==='granted'}catch(e){ok=false}if(ok)addEventListener('deviceorientation',tilt,true);P.remove();reset();run=1}P.onclick=start;
onpointerdown=e=>{let h=s[0],dx=e.clientX/(W/22)-h.x,dy=e.clientY/(H/30)-h.y;d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]};
function f(t){if(run&&t-last>115){last=t;let h={x:s[0].x+d[0],y:s[0].y+d[1]};if(h.x<0)h.x=21;if(h.x>21)h.x=0;if(h.y<0)h.y=29;if(h.y>29)h.y=0;s.unshift(h);if(h.x==food.x&&h.y==food.y){tone(620,.06);food={x:Math.floor(Math.random()*22),y:Math.floor(Math.random()*30)}}else{s.pop();tone(95,.018)}}g.clearRect(0,0,W,H);let cw=W/22,ch=H/30;g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.font='900 '+Math.min(cw*1.35,ch*1.35)+'px Impact';s.forEach((p,i)=>g.fillText('117'[i%3],(p.x+.5)*cw,(p.y+.5)*ch));g.font='900 '+Math.min(cw*1.6,ch*1.6)+'px Impact';g.fillText('7',(food.x+.5)*cw,(food.y+.5)*ch);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
