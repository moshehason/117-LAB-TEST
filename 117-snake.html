<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#000;touch-action:none}canvas{width:100%;height:100%;display:block}.play{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);border:3px solid #000;background:#000;color:#fff;font:900 22px Impact;padding:18px 34px;animation:b .8s steps(1) infinite}@keyframes b{50%{background:#fff;color:#000}}</style></head><body><canvas></canvas><button class=play>PLAY</button><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),B=document.querySelector('button');let W,H,s=[],d=[1,0],food={},run=0,last=0;function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();onresize=R;function reset(){s=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];d=[1,0];food={x:15,y:10}}B.onclick=()=>{B.remove();reset();run=1};onpointerdown=e=>{let h=s[0],gx=e.clientX/(W/22),gy=e.clientY/(H/30),dx=gx-h.x,dy=gy-h.y;d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]};function f(t){if(run&&t-last>115){last=t;let h={x:s[0].x+d[0],y:s[0].y+d[1]};if(h.x<0)h.x=21;if(h.x>21)h.x=0;if(h.y<0)h.y=29;if(h.y>29)h.y=0;s.unshift(h);if(h.x==food.x&&h.y==food.y)food={x:Math.floor(Math.random()*22),y:Math.floor(Math.random()*30)};else s.pop()}x.clearRect(0,0,W,H);let cw=W/22,ch=H/30;x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';x.font='900 '+Math.min(cw*1.35,ch*1.35)+'px Impact';s.forEach((p,i)=>x.fillText('117'[i%3],(p.x+.5)*cw,(p.y+.5)*ch));x.font='900 '+Math.min(cw*1.6,ch*1.6)+'px Impact';x.fillText('7',(food.x+.5)*cw,(food.y+.5)*ch);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
