<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xebe9e4);

 const material=new THREE.MeshPhysicalMaterial({color:0x171717,metalness:.72,roughness:.19,clearcoat:1,clearcoatRoughness:.08,iridescence:.16});
 ['1','1','7'].forEach((ch,i)=>{const g=new TextGeometry(ch,{font,size:3.15,depth:.82,curveSegments:24,bevelEnabled:true,bevelThickness:.13,bevelSize:.095,bevelSegments:12});g.computeBoundingBox();g.center();const m=new THREE.Mesh(g,material.clone());m.position.x=[-2.15,0,2.05][i];m.userData.home=m.position.clone();m.userData.dir=new THREE.Vector3([-1.25,-.15,1.3][i],[.35,-.5,.22][i],[.55,-.35,.45][i]);m.castShadow=true;m.receiveShadow=true;rig.add(m);meshes.push(m)});
});

function loop(t){requestAnimationFrame(loop);explode+=(target-explode)*.055;meshes.forEach((m,i)=>{const h=m.userData.home,d=m.userData.dir;m.position.copy(h).addScaledVector(d,explode);m.position.y+=Math.sin(t*.0013+i*2.1)*.08*explode;m.rotation.z=(i-1)*.12*explode;m.rotation.x=Math.sin(t*.001+i)*.06*explode;m.material.color.setHSL((.01+i*.025+explode*.04)%1,.18,.08+explode*.08)});if(!drag){ry+=vel;vel*=.94;ry+=.001}rig.rotation.x+=(rx-rig.rotation.x)*.08;rig.rotation.y+=(ry-rig.rotation.y)*.08;rig.position.y=Math.sin(t*.0007)*.055;r.render(scene,cam)}requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
