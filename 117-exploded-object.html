<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>117 Exploded Object</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f3f1ec}canvas{width:100%;height:100%;touch-action:none}.t{position:fixed;z-index:2;left:18px;top:18px;font:11px Arial;letter-spacing:3px}.j{position:fixed;z-index:2;right:18px;top:18px;writing-mode:vertical-rl;font:13px Arial;letter-spacing:4px}</style><div class=t>117 LAB / EXPLODED OBJECT</div><div class=j>百十七　分解／再構成</div><canvas id=c></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,dpr,parts=[],open=0,goal=0,ang=0,drag=0,lx=0;
function size(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);build()}addEventListener('resize',size);
function seg(ax,ay,bx,by,n){for(let i=0;i<n;i++){let q=i/(n-1),px=ax+(bx-ax)*q,py=ay+(by-ay)*q;parts.push({x:px,y:py,dx:(px-0.5)*(.8+Math.random()*1.8)+(Math.random()-.5)*.6,dy:(py-0.5)*(.8+Math.random()*1.8)+(Math.random()-.5)*.6,r:Math.random()*6})}}
function build(){parts=[];seg(.18,.28,.27,.22,8);seg(.27,.22,.27,.75,25);seg(.39,.28,.48,.22,8);seg(.48,.22,.48,.75,25);seg(.59,.22,.83,.22,14);seg(.83,.22,.66,.75,27)}
function draw(t){open+=(goal-open)*.065;x.clearRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.rotate(ang);x.translate(-W/2,-H/2);let s=Math.min(W,H);for(let i=0;i<parts.length;i++){let p=parts[i],px=p.x*W+p.dx*s*open,py=p.y*H+p.dy*s*open;let hue=(i*4+t*.02)%360;x.save();x.translate(px,py);x.rotate(p.r*open);x.fillStyle=open>.04?'hsl('+hue+' 75% '+(18+open*35)+'%)':'#111';x.shadowBlur=open*14;x.shadowColor=x.fillStyle;x.fillRect(-s*.016,-s*.016,s*.032,s*.032);x.restore()}x.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
c.onpointerdown=e=>{drag=1;lx=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){ang+=(e.clientX-lx)*.009;lx=e.clientX}};c.onpointerup=e=>{drag=0;goal=goal?0:1};size();
</script>
