<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>117 LIQUID GLASS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}.tag,.hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));font:700 9px Arial,sans-serif;letter-spacing:.16em;color:#111}.tag{left:16px}.hint{right:16px;color:#777}</style></head><body><canvas id=c></canvas><div class=tag>117 / LIQUID GLASS</div><div class=hint>DRAG / 360°</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let d=1,w,h,drag=0,last=0,rot=0,want=0;
function resize(){d=Math.min(devicePixelRatio||1,2.5);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);w=innerWidth;h=innerHeight}resize();onresize=resize;
c.onpointerdown=e=>{drag=1;last=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){want+=(e.clientX-last)*.009;last=e.clientX}};c.onpointerup=()=>drag=0;
function rounded(ctx,digit){ctx.beginPath();if(digit===1){ctx.moveTo(-.30,-.43);ctx.quadraticCurveTo(-.12,-.50,.02,-.69);ctx.quadraticCurveTo(.07,-.75,.15,-.72);ctx.lineTo(.24,-.68);ctx.lineTo(.24,.62);ctx.quadraticCurveTo(.24,.72,.14,.72);ctx.lineTo(-.02,.72);ctx.quadraticCurveTo(-.11,.72,-.11,.62);ctx.lineTo(-.11,-.30);ctx.quadraticCurveTo(-.18,-.21,-.30,-.15);ctx.closePath()}else{ctx.moveTo(-.37,-.69);ctx.quadraticCurveTo(-.37,-.75,-.28,-.75);ctx.lineTo(.35,-.75);ctx.quadraticCurveTo(.42,-.75,.38,-.66);ctx.quadraticCurveTo(.04,-.12,-.05,.64);ctx.quadraticCurveTo(-.06,.73,-.16,.73);ctx.lineTo(-.28,.73);ctx.quadraticCurveTo(-.36,.73,-.34,.63);ctx.quadraticCurveTo(-.25,-.06,.10,-.52);ctx.lineTo(-.29,-.52);ctx.quadraticCurveTo(-.37,-.52,-.37,-.60);ctx.closePath()}}
function glyph(cx,cy,s,num,angle,t,phase){let squash=.36+.64*Math.abs(Math.cos(angle)),flip=Math.cos(angle)<0?-1:1;x.save();x.translate(cx,cy);x.scale(s*squash*flip,s);rounded(x,num);
// glass shell: bright cartoon cel, crisp dark-blue outline, no drop shadow
let shell=x.createLinearGradient(-.45,-.7,.42,.72);shell.addColorStop(0,'rgba(255,255,255,.98)');shell.addColorStop(.22,'rgba(154,226,255,.52)');shell.addColorStop(.48,'rgba(255,255,255,.18)');shell.addColorStop(.72,'rgba(80,185,235,.35)');shell.addColorStop(1,'rgba(255,255,255,.78)');x.fillStyle=shell;x.fill();x.lineWidth=.038;x.strokeStyle='#18222b';x.stroke();x.clip();
// viscous black rubber: coherent wave surface + blobs that stretch instead of fake round bubbles
let level=.18+.055*Math.sin(t*.72+phase);x.beginPath();x.moveTo(-.5,.8);for(let j=0;j<=40;j++){let xx=-.5+j/40,yy=level+.045*Math.sin(xx*9+t*1.15+phase)+.018*Math.sin(xx*23-t*.63);x.lineTo(xx,yy)}x.lineTo(.5,.8);x.closePath();x.fillStyle='#090a0b';x.fill();
for(let i=0;i<8;i++){let u=(i*.173+.11)%1,yy=.63-((t*(.035+.006*(i%3))+u+.15*phase)%1.18),xx=.12*Math.sin(t*.43+i*2.1+phase)+.055*Math.sin(t*.91+i);let rr=.025+.022*(.5+.5*Math.sin(i*3.4+t*.7));x.save();x.translate(xx,yy);x.scale(1+.45*Math.sin(t*.8+i),1.35+.35*Math.cos(t*.6+i));x.beginPath();x.arc(0,0,rr,0,7);x.fillStyle='#090a0b';x.fill();x.restore()}
// cel-style glass highlights
x.lineCap='round';x.strokeStyle='rgba(255,255,255,.90)';x.lineWidth=.026;x.beginPath();x.moveTo(-.17,-.55);x.quadraticCurveTo(-.25,-.12,-.17,.15);x.stroke();x.strokeStyle='rgba(80,205,255,.55)';x.lineWidth=.015;x.beginPath();x.moveTo(.16,-.48);x.quadraticCurveTo(.23,-.10,.16,.34);x.stroke();x.restore();
// redraw crisp silhouette
x.save();x.translate(cx,cy);x.scale(s*squash*flip,s);rounded(x,num);x.lineWidth=.026;x.strokeStyle='#18222b';x.stroke();x.restore()}
function frame(ms){let t=ms*.001;if(!drag)want+=.0033;rot+=(want-rot)*.055;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(0,0,w,h);let s=Math.min(w,h)*.31,cy=h*.50,gap=s*.68,cx=w*.5;glyph(cx-gap,cy,s,1,rot,t,0);glyph(cx,cy,s,1,rot+.05,t,.7);glyph(cx+gap,cy,s,7,rot+.10,t,1.4);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
