<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — BREATH</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .tag,.hint{
    position:fixed;bottom:max(16px,env(safe-area-inset-bottom));
    font:700 9px/1 Arial,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.45);
    pointer-events:none;z-index:10;
  }
  .tag{left:18px}
  .hint{right:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">117 / BREATH</div>
<div class="hint">HOLD · RELEASE</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, D, time = 0;
let pointer = { x: 0.5, y: 0.5, down: false, force: 0 };

// Offscreen for the clean number
const off = document.createElement('canvas');
const octx = off.getContext('2d');

function resize() {
  D = Math.min(devicePixelRatio || 1, 2.5);
  W = canvas.width = off.width = innerWidth * D;
  H = canvas.height = off.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
resize();
addEventListener('resize', resize);

// Pointer
function setPos(e) {
  const t = e.touches ? e.touches[0] : e;
  pointer.x = t.clientX / innerWidth;
  pointer.y = t.clientY / innerHeight;
}
canvas.addEventListener('pointerdown', e => {
  setPos(e); pointer.down = true; pointer.force = 1;
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove', e => { if (pointer.down) setPos(e); });
canvas.addEventListener('pointerup', () => pointer.down = false);
canvas.addEventListener('pointercancel', () => pointer.down = false);

// Soft organic path for digit shapes (simplified rounded 1 and 7)
function digitPath(ctx, d, s) {
  ctx.beginPath();
  if (d === 1) {
    ctx.moveTo(-0.22*s, -0.62*s);
    ctx.quadraticCurveTo(-0.08*s, -0.72*s, 0.06*s, -0.78*s);
    ctx.lineTo(0.18*s, -0.72*s);
    ctx.lineTo(0.18*s, 0.68*s);
    ctx.quadraticCurveTo(0.18*s, 0.78*s, 0.06*s, 0.78*s);
    ctx.lineTo(-0.08*s, 0.78*s);
    ctx.quadraticCurveTo(-0.18*s, 0.78*s, -0.18*s, 0.66*s);
    ctx.lineTo(-0.18*s, -0.28*s);
    ctx.quadraticCurveTo(-0.28*s, -0.18*s, -0.38*s, -0.12*s);
    ctx.closePath();
  } else { // 7
    ctx.moveTo(-0.42*s, -0.72*s);
    ctx.lineTo(0.42*s, -0.72*s);
    ctx.quadraticCurveTo(0.48*s, -0.72*s, 0.44*s, -0.62*s);
    ctx.lineTo(0.02*s, 0.72*s);
    ctx.quadraticCurveTo(-0.02*s, 0.80*s, -0.14*s, 0.78*s);
    ctx.lineTo(-0.28*s, 0.72*s);
    ctx.quadraticCurveTo(-0.34*s, 0.68*s, -0.30*s, 0.58*s);
    ctx.lineTo(0.12*s, -0.48*s);
    ctx.lineTo(-0.38*s, -0.48*s);
    ctx.quadraticCurveTo(-0.46*s, -0.48*s, -0.46*s, -0.58*s);
    ctx.closePath();
  }
}

function drawBreathingNumber(t, force) {
  const breath = 1 + Math.sin(t * 1.1) * 0.045 + force * 0.12;
  const s = Math.min(W, H) * 0.28 * breath;
  const cx = W * 0.5;
  const cy = H * 0.5;
  const gap = s * 0.72;

  // Soft outer glow
  octx.save();
  octx.clearRect(0, 0, W, H);
  octx.fillStyle = '#0a0a0a';
  octx.fillRect(0, 0, W, H);

  // Multiple soft layers for organic feel
  for (let layer = 6; layer >= 0; layer--) {
    const q = layer / 6;
    const scale = 1 + q * 0.08 * (0.6 + force);
    const alpha = 0.04 + (1 - q) * 0.12;
    const blur = q * 18 * D;

    octx.save();
    octx.translate(cx, cy);
    octx.scale(scale, scale);
    octx.shadowColor = `rgba(255, 120, 90, ${0.15 + force * 0.25})`;
    octx.shadowBlur = blur;

    // 1
    octx.save();
    octx.translate(-gap, 0);
    digitPath(octx, 1, s);
    octx.fillStyle = `rgba(255, ${180 - q*40}, ${160 - q*50}, ${alpha})`;
    octx.fill();
    octx.restore();

    // 1
    octx.save();
    octx.translate(0, 0);
    digitPath(octx, 1, s);
    octx.fillStyle = `rgba(255, ${180 - q*40}, ${160 - q*50}, ${alpha})`;
    octx.fill();
    octx.restore();

    // 7
    octx.save();
    octx.translate(gap, 0);
    digitPath(octx, 7, s);
    octx.fillStyle = `rgba(255, ${180 - q*40}, ${160 - q*50}, ${alpha})`;
    octx.fill();
    octx.restore();

    octx.restore();
  }

  // Crisp core
  octx.save();
  octx.translate(cx, cy);
  octx.fillStyle = '#fff5f0';
  octx.shadowColor = 'rgba(255,140,100,0.6)';
  octx.shadowBlur = 12 * D;

  octx.save(); octx.translate(-gap, 0); digitPath(octx, 1, s); octx.fill(); octx.restore();
  octx.save(); octx.translate(0, 0);    digitPath(octx, 1, s); octx.fill(); octx.restore();
  octx.save(); octx.translate(gap, 0);  digitPath(octx, 7, s); octx.fill(); octx.restore();

  octx.restore();
}

function frame(ms) {
  requestAnimationFrame(frame);
  time = ms * 0.001;

  // Smooth force
  if (pointer.down) {
    pointer.force += (1.4 - pointer.force) * 0.08;
  } else {
    pointer.force *= 0.94;
  }

  const force = pointer.force;

  // Draw breathing number to offscreen
  drawBreathingNumber(time, force);

  // Main canvas – dark + subtle vignette + slight displacement based on force
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#080808';
  ctx.fillRect(0, 0, W, H);

  // Soft radial vignette
  const vg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // Draw the number with slight organic warp when pressed
  const warp = force * 14 * D;
  const px = (pointer.x - 0.5) * warp;
  const py = (pointer.y - 0.5) * warp;

  ctx.save();
  ctx.translate(px * 0.3, py * 0.3);
  ctx.globalAlpha = 0.92 + force * 0.08;
  ctx.drawImage(off, 0, 0);
  ctx.restore();

  // Extra glow pulse on press
  if (force > 0.05) {
    const r = (80 + force * 120) * D;
    const g = ctx.createRadialGradient(
      pointer.x * W, pointer.y * H, 0,
      pointer.x * W, pointer.y * H, r
    );
    g.addColorStop(0, `rgba(255,140,100,${0.12 * force})`);
    g.addColorStop(0.5, `rgba(255,90,60,${0.05 * force})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pointer.x * W, pointer.y * H, r, 0, Math.PI * 2);
    ctx.fill();
  }
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
