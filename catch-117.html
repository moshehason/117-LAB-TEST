<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}canvas{width:100%;height:100%}.p{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);border:3px solid #000;background:#000;color:#fff;font:900 22px Impact;padding:18px 34px;animation:b .8s steps(1) infinite}@keyframes b{50%{background:#fff;color:#000}}</style></head><body><canvas></canvas><button class=p>PLAY</button><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),P=document.querySelector('button');let W,H,px=.5,a=[],want=0,seq='117',run=0,score=0;function R(){W=c.width=innerWidth;H=c.height=innerHeight}R();onresize=R;P.onclick=()=>{P.remove();run=1};onpointermove=e=>px=e.clientX/W;function f(){if(run&&Math.random()<.025)a.push({x:.08+Math.random()*.84,y:-.05,v:.003+Math.random()*.004,n:'117'[Math.floor(Math.random()*3)]});g.clearRect(0,0,W,H);g.fillStyle='#000';g.textAlign='center';g.font='900 '+Math.min(W*.13,70)+'px Impact';a.forEach(o=>{o.y+=o.v;g.fillText(o.n,o.x*W,o.y*H);if(o.y>.87&&o.y<.96&&Math.abs(o.x-px)<.13){if(o.n===seq[want]){want++;if(want===3){score++;want=0}}else want=0;o.y=2}});a=a.filter(o=>o.y<1.1);g.fillRect((px-.13)*W,.92*H,.26*W,8);g.font='900 18px Impact';g.fillText(seq.slice(0,want),W/2,35);g.fillText(score,W/2,62);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
