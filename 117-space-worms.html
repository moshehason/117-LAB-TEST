<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>117 SPACE WORMS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,dpr,mask,mg,targets=[],worms=[],px=0,py=0,active=false;
function resize(){dpr=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);build();}
function build(){mask=document.createElement('canvas');mask.width=W;mask.height=H;mg=mask.getContext('2d');mg.clearRect(0,0,W,H);mg.fillStyle='#000';mg.textAlign='center';mg.textBaseline='middle';mg.font='900 '+Math.floor(Math.min(W*.43,H*.18))+'px Arial Black,Arial';mg.fillText('117',W/2,H/2);let im=mg.getImageData(0,0,W,H).data;targets=[];for(let y=0;y<H;y+=5)for(let x=0;x<W;x+=5)if(im[(y*W+x)*4+3]>0)targets.push([x,y]);worms=[];for(let i=0;i<180;i++){let q=targets[(Math.random()*targets.length)|0]||[W/2,H/2],n=7+((Math.random()*8)|0),seg=[];for(let j=0;j<n;j++)seg.push({x:q[0]+j*.2,y:q[1],vx:0,vy:0});worms.push({seg,target:q,phase:Math.random()*6.28,spd:.45+Math.random()*.8,hue:180+Math.random()*150});}}
function frame(ms){let t=ms*.001;g.fillStyle='rgba(255,255,255,.34)';g.fillRect(0,0,W,H);for(let wi=0;wi<worms.length;wi++){let w=worms[wi],h=w.seg[0];if(Math.random()<.004)w.target=targets[(Math.random()*targets.length)|0]||w.target;let dx=w.target[0]-h.x,dy=w.target[1]-h.y,L=Math.hypot(dx,dy)+1;h.vx+=dx/L*.035*w.spd+Math.cos(t*1.8+w.phase)*.018;h.vy+=dy/L*.035*w.spd+Math.sin(t*1.5+w.phase)*.018;if(active){let ax=h.x-px,ay=h.y-py,d=Math.hypot(ax,ay)+1;if(d<130){h.vx+=ax/d*(130-d)*.012;h.vy+=ay/d*(130-d)*.012}}h.vx*=.95;h.vy*=.95;h.x+=h.vx;h.y+=h.vy;for(let j=1;j<w.seg.length;j++){let a=w.seg[j-1],b=w.seg[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1,rest=3.4,f=(d-rest)/d*.48;b.x+=dx*f;b.y+=dy*f}g.lineCap='round';g.lineJoin='round';g.beginPath();for(let j=0;j<w.seg.length;j++){let s=w.seg[j];j?g.lineTo(s.x,s.y):g.moveTo(s.x,s.y)}g.strokeStyle='hsla('+w.hue+',85%,34%,.72)';g.lineWidth=3.5;g.stroke();g.beginPath();g.arc(h.x,h.y,2.8,0,6.283);g.fillStyle='hsla('+(w.hue+30)+',95%,22%,.9)';g.fill()}requestAnimationFrame(frame)}
function pos(e){px=e.clientX;py=e.clientY}c.addEventListener('pointerdown',e=>{active=true;pos(e)});c.addEventListener('pointermove',pos);c.addEventListener('pointerup',()=>active=false);c.addEventListener('pointercancel',()=>active=false);addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></body></html>
