<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 BACKROOMS V5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block}#grain{pointer-events:none;position:fixed;inset:0;z-index:4;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");mix-blend-mode:screen;animation:g .13s steps(2) infinite}@keyframes g{50%{transform:translate(2px,-2px)}}#flash{position:fixed;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}#fade{position:fixed;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none}</style></head>
<body><div id="grain"></div><div id="flash"></div><div id="fade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020202);scene.fog=new THREE.FogExp2(0x020202,.055);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,120);
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});ren.setPixelRatio(Math.min(devicePixelRatio,1.45));ren.setSize(innerWidth,innerHeight);ren.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(ren.domElement);
const white=new THREE.MeshStandardMaterial({color:0xbdbdbd,roughness:1}), dark=new THREE.MeshStandardMaterial({color:0x090909,roughness:1}), black=new THREE.MeshBasicMaterial({color:0}); ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.35;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,110),new THREE.MeshStandardMaterial({color:0x171717,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.z=-38;scene.add(floor);
const ceil=floor.clone();ceil.position.y=4.3;ceil.rotation.x=Math.PI/2;scene.add(ceil);
function box(x,y,z,sx,sy,sz,mat=white){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);scene.add(m);return m}
// irregular cave/backroom corridor
for(let z=4;z>-88;z-=5.5){let bend=Math.sin(z*.13)*1.35;box(-5.1+bend,2.1,z,1.25,4.3,5.2);box(5.1+bend,2.1,z,1.25,4.3,5.2);if(Math.abs(z%16)<5){box(-2.9+bend,2.1,z-.2,.35,4.3,.45,dark);box(2.9+bend,2.1,z-.2,.35,4.3,.45,dark)}}
for(let z=0;z>-78;z-=9){let b=Math.sin(z*.13)*1.35;const l=new THREE.PointLight(0xffffff,13,12,2);l.position.set(b,3.75,z-2);scene.add(l);const tube=box(b,4.05,z-2,2.4,.06,.12,new THREE.MeshBasicMaterial({color:0xffffff}));}
const altar=box(0,.35,-82,5.8,.7,1.5,dark);altar.visible=false;
const flesh=new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:.9});
function organic(x){const g=new THREE.Group();g.position.set(x,0,-84);scene.add(g);const torso=new THREE.Mesh(new THREE.SphereGeometry(.48,14,18),flesh);torso.scale.set(.65,1.75,.48);torso.position.y=1.65;g.add(torso);const chest=new THREE.Mesh(new THREE.SphereGeometry(.52,14,16),flesh);chest.scale.set(.82,.7,.5);chest.position.y=2.05;g.add(chest);const head=new THREE.Mesh(new THREE.SphereGeometry(.29,14,14),flesh);head.scale.set(.72,1.28,.75);head.position.y=2.92;g.add(head);for(const side of[-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.085,1.45,5,8),flesh);arm.position.set(side*.37,1.45,0);arm.rotation.z=side*.05;g.add(arm);const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.105,1.35,5,8),flesh);leg.position.set(side*.16,.48,0);g.add(leg)}g.visible=false;return g}
const one1=organic(-1.35),one2=organic(0),seven=organic(1.55);
const doorL=box(-1.6,2.15,-76,3.2,4.3,.25,dark),doorR=box(1.6,2.15,-76,3.2,4.3,.25,dark);
const amb=new THREE.HemisphereLight(0x777777,0x000000,.42);scene.add(amb);
cam.position.set(0,1.65,5);
let start=performance.now(),tilt=0,last=0;
addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=THREE.MathUtils.clamp(e.gamma/45,-1,1)},{passive:true});
let dragX=0,down=false,px=0;addEventListener('pointerdown',e=>{down=true;px=e.clientX});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(down){dragX+=(e.clientX-px)*.0025;px=e.clientX}});
function ease(a,b,t){t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)}
function animate(now){requestAnimationFrame(animate);const t=(now-start)/1000;let z=t<15?5-ease(0,15,t)*74:-69-ease(15,18,t)*5.2;const bend=Math.sin(z*.13)*1.2;cam.position.x=THREE.MathUtils.lerp(cam.position.x,bend+tilt*.42+dragX,.05);cam.position.z=z;cam.position.y=1.65+Math.sin(t*8)*.025;cam.rotation.y=THREE.MathUtils.lerp(cam.rotation.y,-Math.sin(z*.13)*.14-tilt*.08-dragX*.3,.05);if(t>15){const o=ease(15,17.2,t);doorL.position.x=-1.6-o*2.7;doorR.position.x=1.6+o*2.7}if(t>17.1){altar.visible=one1.visible=one2.visible=seven.visible=true}const q=ease(19.2,24.5,t);one1.scale.y=one2.scale.y=1+q*.18;seven.rotation.z=-q*.68;seven.position.y=q*.55;seven.children[0].rotation.z=-q*.55;seven.children[1].rotation.z=-q*.72;seven.children[2].position.x=-q*.65;seven.children[2].rotation.z=-q*.8;seven.children[3].rotation.z=-1.25*q;seven.children[4].rotation.z=.65*q;seven.children[5].rotation.z=.65*q;if(t>28)document.getElementById('fade').style.opacity=String(ease(28,29.3,t));if(t>30){start=now;doorL.position.x=-1.6;doorR.position.x=1.6;altar.visible=one1.visible=one2.visible=seven.visible=false;seven.position.set(1.55,0,-84);seven.rotation.z=0;document.getElementById('fade').style.opacity='0'}ren.render(scene,cam)}requestAnimationFrame(animate);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
</script></body></html>
