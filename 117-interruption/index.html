<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>117 INTERRUPTION</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:#eee;font-family:Arial,Helvetica,sans-serif}
#world{position:fixed;inset:0;perspective:700px;background:radial-gradient(ellipse at 50% 45%,#182025 0,#080b0d 34%,#010202 76%);transition:filter 1.2s}
.hall{position:absolute;inset:-10%;transform-style:preserve-3d;animation:walk 8s ease-in-out forwards}
.wall{position:absolute;top:0;height:100%;width:55%;background:repeating-linear-gradient(90deg,#12181a 0 3px,#252d2f 4px 6px,#101416 8px 15px);filter:brightness(.55)}
.left{left:-15%;clip-path:polygon(0 0,100% 14%,100% 86%,0 100%)}.right{right:-15%;clip-path:polygon(0 14%,100% 0,100% 100%,0 86%)}
.floor{position:absolute;left:15%;right:15%;bottom:-12%;height:48%;background:linear-gradient(#11191a,#020303);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.door{position:absolute;left:50%;top:18%;width:34%;height:64%;transform:translateX(-50%);border:8px solid #25292a;background:#030404;box-shadow:0 0 80px #000}
.opening{position:absolute;inset:3%;overflow:hidden;background:radial-gradient(circle at 50% 62%,#c8792a 0 2%,#4a2311 12%,#050303 48%,#000 70%)}
.leaf{position:absolute;top:0;width:51%;height:100%;background:linear-gradient(90deg,#181a1a,#343536,#111);border:1px solid #555;transition:transform 2.2s cubic-bezier(.2,.8,.2,1);z-index:4}
.leaf:after{content:"";position:absolute;inset:8%;background:repeating-linear-gradient(0deg,transparent 0 44px,#090909 45px 47px)}
.l{left:0;transform-origin:left}.r{right:0;transform-origin:right}.open .l{transform:perspective(500px) rotateY(-76deg)}.open .r{transform:perspective(500px) rotateY(76deg)}
.candles{position:absolute;left:12%;right:12%;bottom:22%;height:8%;background:repeating-linear-gradient(90deg,transparent 0 10px,#ffd890 11px 13px,transparent 14px 22px);filter:blur(1px);box-shadow:0 0 24px #e98b38}
.figures{position:absolute;inset:12% 6% 8%;display:flex;justify-content:space-around;align-items:flex-end;opacity:0;transition:opacity 2s 1s}
.open .figures{opacity:.85}.figure{width:18%;height:55%;background:linear-gradient(#ddd,#8e8d89);clip-path:polygon(35% 0,65% 0,75% 18%,92% 100%,8% 100%,25% 18%);filter:brightness(.55)}
#title{position:absolute;top:18%;left:50%;transform:translateX(-50%);z-index:10;text-align:center;font-size:clamp(28px,7vw,52px);letter-spacing:-1px;background:#050505dd;padding:8px 14px}
#choice{position:absolute;z-index:12;left:7%;right:7%;bottom:9%;padding:18px;background:#050505d9;border-radius:22px;text-align:center;opacity:0;transform:translateY(30px);transition:.8s;pointer-events:none}
#choice.show{opacity:1;transform:none;pointer-events:auto}#choice h2{font-size:22px;margin:0 0 14px}
button{display:block;width:100%;margin:10px 0;padding:18px;border:1px solid #777;border-radius:12px;background:#252525dd;color:#eee;font-size:22px}
#mark{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:#fff;color:#000;font:bold 28vw Arial;opacity:0;pointer-events:none}
#mark.flash{animation:flash 1.4s ease forwards}
@keyframes walk{0%{transform:scale(1)}100%{transform:scale(1.12)}}@keyframes flash{0%{opacity:0}15%,55%{opacity:1}100%{opacity:0}}
.small{position:absolute;bottom:2%;width:100%;text-align:center;z-index:9;font-size:10px;letter-spacing:4px;opacity:.35}
</style></head><body>
<div id="world"><div class="hall"><div class="wall left"></div><div class="wall right"></div><div class="floor"></div><div class="door" id="door"><div class="opening"><div class="candles"></div><div class="figures"><i class="figure"></i><i class="figure"></i><i class="figure"></i><i class="figure"></i></div></div><div class="leaf l"></div><div class="leaf r"></div></div></div></div>
<div id="title">INTERACTIVE<br>117</div>
<div id="choice"><h2>WHAT DO YOU DO?</h2><button id="enter">ENTER</button><button id="leave">LEAVE</button></div>
<div id="mark">117</div><div class="small">117 INTERRUPTION · PROTOTYPE 01</div>
<script>
const door=document.querySelector('#door'),choice=document.querySelector('#choice'),mark=document.querySelector('#mark'),world=document.querySelector('#world');
setTimeout(()=>door.classList.add('open'),1800);setTimeout(()=>choice.classList.add('show'),4100);
function end(mode){choice.classList.remove('show'); if(mode==='enter'){world.style.filter='contrast(1.6) brightness(.45)';door.style.transform='translateX(-50%) scale(2.2)';door.style.transition='transform 2.2s ease-in';setTimeout(()=>{mark.classList.add('flash')},1200)}else{mark.classList.add('flash')} setTimeout(()=>location.reload(),3600)}
enter.onclick=()=>end('enter');leave.onclick=()=>end('leave');
let x=0,y=0;addEventListener('pointermove',e=>{x=(e.clientX/innerWidth-.5)*8;y=(e.clientY/innerHeight-.5)*5;world.style.transform=`translate(${x}px,${y}px)`});
</script></body></html>
