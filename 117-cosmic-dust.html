<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>COSMIC DUST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}</style></head><body><canvas id=c></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'),T='cosmic';let W,H,D,A=[],tar=[],mx=0,my=0,on=0;
function init(){W=document.documentElement.clientWidth;H=document.documentElement.clientHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);let m=document.createElement('canvas');m.width=W;m.height=H;let q=m.getContext('2d');q.textAlign='center';q.textBaseline='middle';q.fillStyle='#000';let fs=Math.min(W*.92,H*.32);q.font='900 '+fs+'px Arial Black,Arial,sans-serif';let tw=q.measureText('117').width;if(tw>W*.92){fs*=W*.92/tw;q.font='900 '+fs+'px Arial Black,Arial,sans-serif'}q.fillText('117',W/2,H/2);let im=q.getImageData(0,0,W,H).data;tar=[];for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3)if(im[(y*W+x)*4+3]>20)tar.push([x,y]);A=[];let n=T==='organic'?900:T==='nodes'?1000:1500;for(let i=0;i<n;i++){let z=tar[(Math.random()*tar.length)|0]||[W/2,H/2];A.push({x:z[0],y:z[1],tx:z[0],ty:z[1],vx:0,vy:0,p:Math.random()*6.28,r:.7+Math.random()*1.6,h:[]})}}
function loop(ms){let t=ms*.001;g.fillStyle=T==='cosmic'?'rgba(255,255,255,.18)':'#fff';g.fillRect(0,0,W,H);for(let i=0;i<A.length;i++){let a=A[i],dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy)+1;a.vx+=dx*.004;a.vy+=dy*.004;if(T==='nodes'){a.vx-=dy/d*.025;a.vy+=dx/d*.025}if(T==='chrome'){a.vx+=Math.sin(t+a.p)*.025;a.vy+=Math.cos(t*.8+a.p)*.025}if(T==='fire'){a.vy-=.035;a.vx+=Math.sin(t*4+a.p)*.05}if(T==='organic'){a.vx+=Math.sin(t*.7+a.p)*.04;a.vy+=Math.cos(t*.6+a.p)*.04}if(T==='magnetic'){a.vx-=dy/d*.065*Math.sin(t+a.p);a.vy+=dx/d*.065*Math.sin(t+a.p)}if(T==='glitch'){a.vx+=(Math.random()-.5)*.09;a.vy+=(Math.random()-.5)*.035}if(T==='neon'){a.vx+=Math.sin(t*2+a.p)*.045;a.vy+=Math.cos(t*1.7+a.p)*.045}if(T==='cosmic'){a.vx-=dy/d*.04;a.vy+=dx/d*.04}if(on){let ex=a.x-mx,ey=a.y-my,ed=Math.hypot(ex,ey)+1;if(ed<95){a.vx+=ex/ed*(95-ed)*.025;a.vy+=ey/ed*(95-ed)*.025}}a.vx*=.93;a.vy*=.93;a.x+=a.vx;a.y+=a.vy;
if(T==='chrome'){g.fillStyle='rgba(65,70,78,.52)'}else if(T==='fire'){g.fillStyle=i%3?'rgba(255,65,0,.72)':'rgba(20,5,0,.8)'}else if(T==='organic'){g.fillStyle=i%3?'rgba(75,8,10,.55)':'rgba(10,8,9,.72)'}else if(T==='neon'){g.fillStyle=i%2?'rgba(25,90,255,.58)':'rgba(230,20,255,.5)'}else if(T==='cosmic'){g.fillStyle=i%3?'rgba(20,18,45,.52)':'rgba(255,90,20,.5)'}else g.fillStyle='rgba(8,8,10,.62)';
if(T==='glitch'){g.fillRect(a.x,a.y,2+Math.random()*8,1+Math.random()*3)}else{g.beginPath();g.arc(a.x,a.y,a.r,0,6.283);g.fill()}
if(T==='nodes'&&i%10===0){g.strokeStyle='rgba(0,0,0,.12)';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-a.vx*20,a.y-a.vy*20);g.stroke()}}requestAnimationFrame(loop)}
c.onpointerdown=e=>{on=1;mx=e.clientX;my=e.clientY};c.onpointermove=e=>{mx=e.clientX;my=e.clientY};c.onpointerup=()=>on=0;c.onpointercancel=()=>on=0;addEventListener('resize',init);init();requestAnimationFrame(loop);
</script></body></html>
