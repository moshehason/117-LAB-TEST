<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — ACID / PREDATOR</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent!important;touch-action:none}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  .tag,.hint{
    position:fixed;bottom:max(14px,env(safe-area-inset-bottom));
    font:700 9px/1 Arial,sans-serif;letter-spacing:.18em;
    color:rgba(0,0,0,.45);pointer-events:none;z-index:20;
  }
  .tag{left:16px}
  .hint{right:16px}
  .mode{
    position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;
    transform:translateX(-50%);
    font:900 11px/1 Arial,sans-serif;letter-spacing:.2em;
    color:rgba(255,80,0,.7);z-index:20;pointer-events:none;
    opacity:0;transition:opacity .4s;
  }
  .mode.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>


<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const modeEl = {classList:{add(){},remove(){}}};
let W, H, D, time = 0;
let pointer = { x: 0.5, y: 0.5, down: false, force: 0 };
let thermal = false;

// Multiple logo instances
const logos = [];
const LOGO_COUNT = 9;

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
resize();
addEventListener('resize', resize);

// Init logos
for (let i = 0; i < LOGO_COUNT; i++) {
  logos.push({
    x: Math.random(),
    y: Math.random(),
    scale: 0.4 + Math.random() * 0.9,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    vx: (Math.random() - 0.5) * 0.003,
    vy: (Math.random() - 0.5) * 0.003,
    hue: Math.random() * 360,
    phase: Math.random() * Math.PI * 2,
    pulse: 0.8 + Math.random() * 0.4
  });
}

function setPos(e) {
  const t = e.touches ? e.touches[0] : e;
  pointer.x = t.clientX / innerWidth;
  pointer.y = t.clientY / innerHeight;
}

canvas.addEventListener('pointerdown', e => {
  setPos(e);
  pointer.down = true;
  pointer.force = 1;
  
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove', e => { if (pointer.down) setPos(e); });
canvas.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });

function drawLogo(x, y, scale, rot, hue, alpha, isThermal) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  const size = Math.min(W, H) * 0.22;

  if (isThermal) {
    // Predator thermal look – hot core, cooler edges
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.9);
    grad.addColorStop(0, '#fff6b0');
    grad.addColorStop(0.25, '#ff9a00');
    grad.addColorStop(0.55, '#ff2a00');
    grad.addColorStop(0.8, '#6b0000');
    grad.addColorStop(1, 'rgba(20,0,0,0)');
    ctx.fillStyle = grad;
    ctx.font = `900 ${size}px Arial Black, Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('117', 0, 0);

    // Extra heat bloom
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = 'rgba(255, 80, 0, 0.25)';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  } else {
    // Acid / psychedelic look
    ctx.font = `900 ${size}px Arial Black, Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Chromatic layers
    ctx.fillStyle = `hsla(${hue}, 100%, 60%, 0.7)`;
    ctx.fillText('117', -4 * D, 2 * D);
    ctx.fillStyle = `hsla(${(hue + 120) % 360}, 100%, 60%, 0.7)`;
    ctx.fillText('117', 4 * D, -2 * D);
    ctx.fillStyle = `hsla(${(hue + 240) % 360}, 100%, 70%, 0.9)`;
    ctx.fillText('117', 0, 0);

    // Outer glow
    ctx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
    ctx.shadowBlur = 28 * D;
    ctx.fillStyle = `hsla(${hue}, 100%, 80%, 0.5)`;
    ctx.fillText('117', 0, 0);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function frame(ms) {
  requestAnimationFrame(frame);
  time = ms * 0.001;

  // Smooth force
  if (pointer.down) pointer.force += (1.3 - pointer.force) * 0.1;
  else pointer.force *= 0.92;

  
  }

  // Transparent canvas background
  ctx.clearRect(0, 0, W, H);

  // Update + draw logos
  for (const L of logos) {
    // Movement
    L.x += L.vx + Math.sin(time * 1.3 + L.phase) * 0.0015;
    L.y += L.vy + Math.cos(time * 1.1 + L.phase) * 0.0015;
    L.rot += L.rotSpeed + (pointer.force * 0.02 * (Math.random() - 0.5));
    L.hue += 1.8;

    // Bounce
    if (L.x < -0.2 || L.x > 1.2) L.vx *= -1;
    if (L.y < -0.2 || L.y > 1.2) L.vy *= -1;

    // Attract slightly to pointer when pressed
    if (pointer.down) {
      L.vx += (pointer.x - L.x) * 0.0008;
      L.vy += (pointer.y - L.y) * 0.0008;
    }

    // Limit speed
    L.vx *= 0.99;
    L.vy *= 0.99;

    const pulse = 1 + Math.sin(time * 2.5 + L.phase) * 0.12 * L.pulse;
    const sc = L.scale * pulse * (1 + pointer.force * 0.25);

    drawLogo(
      L.x * W,
      L.y * H,
      sc,
      L.rot,
      L.hue,
      0.55 + Math.random() * 0.35,
      false
    );
  }

  // Extra acid trails when not thermal
  if (!thermal && pointer.force > 0.1) {
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++) {
      const ang = time * 3 + i;
      const r = (40 + i * 30) * D * pointer.force;
      ctx.beginPath();
      ctx.arc(pointer.x * W, pointer.y * H, r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${(time * 80 + i * 50) % 360}, 100%, 60%, ${0.15 * pointer.force})`;
      ctx.lineWidth = 2 * D;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
