<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — THERMAL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#f4f3ef;touch-action:none}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  #clean{
    position:absolute;inset:0;display:grid;place-items:center;
    background:#f4f3ef;z-index:5;transition:opacity .45s ease;
  }
  #clean.gone{opacity:0;pointer-events:none}
  #clean .n{
    font:900 clamp(110px,30vw,260px)/0.85 Arial Black,Arial,sans-serif;
    letter-spacing:-0.07em;color:#0a0a0a;
    transition:color .2s,filter .3s,transform .3s;
    cursor:pointer;user-select:none;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.2));
  }
  #clean .n.hot{
    color:#fffef8;
    filter:drop-shadow(0 0 24px #fff) drop-shadow(0 0 60px #ff8a00) drop-shadow(0 0 100px #ff2200);
    transform:scale(1.08);
  }
  .tag,.hint{
    position:fixed;bottom:max(14px,env(safe-area-inset-bottom));
    font:700 9px/1 Arial,sans-serif;letter-spacing:.16em;
    z-index:20;pointer-events:none;transition:color .5s;
  }
  .tag{left:16px;color:rgba(0,0,0,.28)}
  .hint{right:16px;color:rgba(0,0,0,.22)}
  .tag.thermal,.hint.thermal{color:rgba(140,200,255,.4)}
</style>
</head>
<body>
<div id="clean"><div class="n" id="logo">117</div></div>
<canvas id="c"></canvas>
<div class="tag" id="tag">117 / THERMAL</div>
<div class="hint" id="hint">TAP 117</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const clean = document.getElementById('clean');
const logo = document.getElementById('logo');
const tag = document.getElementById('tag');
const hint = document.getElementById('hint');

let W, H, D, time = 0;
let mode = 'clean';
let transition = 0, pulseT = 0, logoHeat = 0, exposure = 1, scanY = 0;
let heatMap, heatCtx;
let pointer = { x: 0.5, y: 0.5, down: false, px: 0.5, py: 0.5 };
const layers = [];
const drips = []; // molten drips from 117

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  const hw = Math.max(180, W >> 1), hh = Math.max(180, H >> 1);
  heatMap = document.createElement('canvas');
  heatMap.width = hw; heatMap.height = hh;
  heatCtx = heatMap.getContext('2d');
  heatCtx.fillStyle = '#000';
  heatCtx.fillRect(0, 0, hw, hh);
  buildWorld();
}
resize();
addEventListener('resize', resize);

function buildWorld() {
  layers.length = 0;
  for (let L = 0; L < 7; L++) {
    const depth = L / 6;
    const leaves = [];
    const n = 22 + Math.floor((1 - depth) * 36);
    for (let i = 0; i < n; i++) {
      leaves.push({
        x: Math.random(), y: Math.random(),
        w: 0.06 + Math.random() * 0.32,
        h: 0.04 + Math.random() * 0.22,
        rot: (Math.random() - 0.5) * 1.8,
        phase: Math.random() * 6.28,
        type: Math.floor(Math.random() * 5),
        base: 0.14 + Math.random() * 0.18 + (1 - depth) * 0.14
      });
    }
    const vines = [];
    if (depth < 0.75) {
      for (let v = 0; v < 4 + (Math.random() * 4 | 0); v++) {
        vines.push({
          x: Math.random(),
          len: 0.2 + Math.random() * 0.55,
          phase: Math.random() * 12,
          thick: 0.006 + Math.random() * 0.014
        });
      }
    }
    layers.push({ depth, leaves, vines });
  }
}

function setPos(e) {
  const t = e.touches ? e.touches[0] : e;
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = t.clientX / innerWidth;
  pointer.y = t.clientY / innerHeight;
}
function onDown(e) {
  setPos(e); pointer.down = true;
  if (mode === 'clean') {
    mode = 'heating'; logo.classList.add('hot');
    logoHeat = 1; pulseT = 0; transition = 0;
    setTimeout(() => {
      mode = 'jungle';
      clean.classList.add('gone');
      tag.classList.add('thermal'); hint.classList.add('thermal');
      hint.textContent = 'TOUCH · HOLD TO EXIT';
    }, 500);
  } else if (mode === 'jungle') {
    const dx = pointer.x - 0.5, dy = pointer.y - 0.5;
    if (Math.hypot(dx, dy) < 0.22) logoHeat = Math.min(1, logoHeat + 0.9);
  }
}
function onUp() { pointer.down = false; }

let pressT = null;
function startHold() {
  clearTimeout(pressT);
  pressT = setTimeout(() => { if (mode === 'jungle' && pointer.down) mode = 'cooling'; }, 800);
}
function cancelHold() { clearTimeout(pressT); }

canvas.addEventListener('pointerdown', e => { onDown(e); startHold(); canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (pointer.down) setPos(e); });
canvas.addEventListener('pointerup', () => { onUp(); cancelHold(); });
canvas.addEventListener('pointercancel', () => { onUp(); cancelHold(); });
logo.addEventListener('pointerdown', e => { e.stopPropagation(); onDown(e); startHold(); });

// Heat buffer
function updateHeat() {
  const hw = heatMap.width, hh = heatMap.height;
  heatCtx.fillStyle = 'rgba(0,0,0,0.036)';
  heatCtx.fillRect(0, 0, hw, hh);

  if (pointer.down && (mode === 'jungle' || mode === 'heating')) {
    const x = pointer.x * hw, y = pointer.y * hh;
    const px = pointer.px * hw, py = pointer.py * hh;
    const dist = Math.hypot(x - px, y - py);
    const s = Math.min(1.6, 0.5 + dist * 0.08);
    const g = heatCtx.createRadialGradient(x, y, 0, x, y, 24 * s);
    g.addColorStop(0, `rgba(255,255,255,${0.7*s})`);
    g.addColorStop(0.35, `rgba(255,140,20,${0.32*s})`);
    g.addColorStop(1, 'transparent');
    heatCtx.fillStyle = g;
    heatCtx.beginPath(); heatCtx.arc(x, y, 24*s, 0, 6.28); heatCtx.fill();
    if (dist > 2) {
      heatCtx.strokeStyle = `rgba(255,180,40,${0.3*s})`;
      heatCtx.lineWidth = 14 * s; heatCtx.lineCap = 'round';
      heatCtx.beginPath(); heatCtx.moveTo(px, py); heatCtx.lineTo(x, y); heatCtx.stroke();
    }
  }
  if (logoHeat > 0.05) {
    const g = heatCtx.createRadialGradient(hw/2, hh/2, 0, hw/2, hh/2, 36 + logoHeat*30);
    g.addColorStop(0, `rgba(255,255,255,${0.8*logoHeat})`);
    g.addColorStop(0.3, `rgba(255,90,0,${0.45*logoHeat})`);
    g.addColorStop(1, 'transparent');
    heatCtx.fillStyle = g;
    heatCtx.beginPath(); heatCtx.arc(hw/2, hh/2, 36+logoHeat*30, 0, 6.28); heatCtx.fill();
  }
}

// Palette matched to reference image
function therm(t) {
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.1) { const k=t/0.1; r=0+k*10; g=0; b=20+k*50; }
  else if (t < 0.25) { const k=(t-0.1)/0.15; r=5; g=15+k*100; b=70+k*140; }
  else if (t < 0.42) { const k=(t-0.25)/0.17; r=20+k*30; g=115+k*90; b=200-k*60; }
  else if (t < 0.58) { const k=(t-0.42)/0.16; r=50+k*120; g=200-k*20; b=140-k*90; }
  else if (t < 0.75) { const k=(t-0.58)/0.17; r=170+k*70; g=180-k*80; b=50-k*30; }
  else if (t < 0.9) { const k=(t-0.75)/0.15; r=240+k*15; g=100-k*60; b=20-k*10; }
  else { const k=(t-0.9)/0.1; r=255; g=40+k*200; b=10+k*230; }
  return [r|0, g|0, b|0];
}

function drawLeaf(leaf, depth) {
  const par = (pointer.x-0.5)*55*depth*D;
  const parY = (pointer.y-0.5)*32*depth*D;
  const x = leaf.x*W + par, y = leaf.y*H + parY;
  const w = leaf.w*Math.min(W,H), h = leaf.h*Math.min(W,H);
  const sway = Math.sin(time*(1.2+depth)+leaf.phase)*0.1;

  let boost = 0;
  const d = Math.hypot(leaf.x-pointer.x, leaf.y-pointer.y);
  if (pointer.down && d < 0.2) boost = (0.2-d)/0.2*0.95;
  const ld = Math.hypot(leaf.x-0.5, leaf.y-0.5);
  if (ld < 0.3) boost = Math.max(boost, logoHeat*(1-ld/0.3)*0.8);

  const temp = leaf.base + boost*0.6 + Math.sin(time*2+leaf.phase)*0.03;
  const [r,g,b] = therm(temp);

  ctx.save();
  ctx.translate(x,y); ctx.rotate(leaf.rot+sway);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.beginPath();
  if (leaf.type === 0) ctx.ellipse(0,0,w*0.5,h*0.48,0,0,6.28);
  else if (leaf.type === 1) ctx.ellipse(0,0,w*0.55,h*0.36,0,0,6.28);
  else if (leaf.type === 2) {
    ctx.moveTo(0,-h*0.5); ctx.quadraticCurveTo(w*0.55,0,0,h*0.5); ctx.quadraticCurveTo(-w*0.55,0,0,-h*0.5);
  } else if (leaf.type === 3) {
    ctx.ellipse(-w*0.18,0,w*0.32,h*0.4,-0.35,0,6.28);
    ctx.ellipse(w*0.18,0,w*0.32,h*0.4,0.35,0,6.28);
  } else {
    // palm-ish
    for (let i=-2;i<=2;i++) {
      ctx.ellipse(i*w*0.12, Math.abs(i)*h*0.08, w*0.2, h*0.45, i*0.25, 0, 6.28);
    }
  }
  ctx.fill();
  const [vr,vg,vb] = therm(temp*0.7);
  ctx.strokeStyle = `rgba(${vr},${vg},${vb},0.4)`;
  ctx.lineWidth = 1.1*D;
  ctx.beginPath(); ctx.moveTo(0,-h*0.35); ctx.lineTo(0,h*0.35); ctx.stroke();
  ctx.restore();
}

function drawVine(v, depth) {
  const par = (pointer.x-0.5)*42*depth*D;
  const x = v.x*W + par;
  const top = (0.01+Math.sin(time*0.35+v.phase)*0.02)*H;
  const len = v.len*H;
  const [r,g,b] = therm(0.18+depth*0.12);
  ctx.strokeStyle = `rgb(${r},${g},${b})`;
  ctx.lineWidth = v.thick*Math.min(W,H);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.quadraticCurveTo(x+Math.sin(time*0.6+v.phase)*20*D, top+len*0.5, x+Math.sin(v.phase)*12*D, top+len);
  ctx.stroke();
}

function spawnDrips() {
  if (logoHeat < 0.25 || Math.random() > 0.4) return;
  for (let i = 0; i < 2; i++) {
    drips.push({
      x: 0.35 + Math.random()*0.3,
      y: 0.52,
      vy: 0.4 + Math.random()*1.2,
      life: 1,
      w: 1.5 + Math.random()*2.5
    });
  }
}

function drawMolten117() {
  const pulse = 1 + Math.sin(time*5)*0.04*Math.max(0.25, logoHeat);
  const fs = Math.min(W,H)*0.21*pulse;
  ctx.save();
  ctx.translate(W/2, H*0.42);

  // Outer heat aura (blue-cyan rim like reference)
  if (logoHeat > 0.1) {
    const aura = ctx.createRadialGradient(0,0,fs*0.3,0,0,fs*1.5);
    aura.addColorStop(0, `rgba(255,200,80,${0.25*logoHeat})`);
    aura.addColorStop(0.4, `rgba(0,180,255,${0.2*logoHeat})`);
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0,0,fs*1.5,0,6.28); ctx.fill();
  }

  ctx.font = `900 ${fs}px Arial Black, Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // Molten body — white-hot core, red-orange edges
  const [cr,cg,cb] = therm(0.72 + logoHeat*0.28);
  ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
  ctx.shadowColor = `rgba(255,${60+logoHeat*180},0,${0.7*logoHeat})`;
  ctx.shadowBlur = 36*D*logoHeat;
  ctx.fillText('117', 0, 0);
  ctx.shadowBlur = 0;

  // Hotter inner pass
  if (logoHeat > 0.3) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,255,230,${0.35*logoHeat})`;
    ctx.fillText('117', 0, 0);
    // slight chromatic edge
    ctx.fillStyle = `rgba(0,200,255,${0.12*logoHeat})`;
    ctx.fillText('117', -1.5*D, 0.5*D);
    ctx.fillStyle = `rgba(255,40,0,${0.12*logoHeat})`;
    ctx.fillText('117', 1.5*D, -0.5*D);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();

  // Drips
  spawnDrips();
  for (let i = drips.length-1; i >= 0; i--) {
    const d = drips[i];
    d.y += d.vy * 0.008;
    d.vy += 0.08;
    d.life -= 0.012;
    if (d.life <= 0 || d.y > 1.1) { drips.splice(i,1); continue; }
    const [dr,dg,db] = therm(0.7 + d.life*0.25);
    ctx.fillStyle = `rgba(${dr},${dg},${db},${d.life})`;
    ctx.beginPath();
    ctx.ellipse(d.x*W, d.y*H, d.w*D, d.w*2.2*D, 0, 0, 6.28);
    ctx.fill();
  }
}

function drawJungle() {
  ctx.fillStyle = '#000510';
  ctx.fillRect(0,0,W,H);

  // Vertical light shafts (cooler cyan)
  for (let i = 0; i < 5; i++) {
    const sx = (0.15 + i*0.18 + Math.sin(time*0.3+i)*0.03)*W;
    const grd = ctx.createLinearGradient(sx, 0, sx, H);
    grd.addColorStop(0, 'rgba(0,120,200,0.06)');
    grd.addColorStop(0.5, 'rgba(0,80,140,0.03)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(sx - 40*D, 0, 80*D, H);
  }

  for (let Li = layers.length-1; Li >= 0; Li--) {
    const layer = layers[Li];
    if (layer.depth > 0.2) {
      ctx.fillStyle = `rgba(0,10,30,${0.06+layer.depth*0.1})`;
      ctx.fillRect(0,0,W,H);
    }
    for (const v of layer.vines) drawVine(v, layer.depth);
    for (const leaf of layer.leaves) drawLeaf(leaf, layer.depth);
  }

  drawMolten117();

  // Soft heat overlay
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(heatMap, 0, 0, W, H);
  ctx.restore();

  // Sensor FX
  scanY = (scanY + 2*D) % H;
  ctx.fillStyle = 'rgba(150,210,255,0.03)';
  ctx.fillRect(0, scanY, W, 2*D);
  if (Math.random() < 0.45) {
    ctx.fillStyle = 'rgba(255,255,255,0.012)';
    for (let i=0;i<35;i++) ctx.fillRect(Math.random()*W, Math.random()*H, 1.2*D, 1.2*D);
  }
  if (Math.random() < 0.006) exposure = 0.6 + Math.random()*0.7;
  exposure += (1-exposure)*0.04;
  if (Math.abs(exposure-1) > 0.03) {
    ctx.fillStyle = `rgba(0,0,0,${(1-exposure)*0.2})`;
    ctx.fillRect(0,0,W,H);
  }
  const vig = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  vig.addColorStop(0.55,'transparent');
  vig.addColorStop(1,'rgba(0,0,15,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);
}

function drawPulse() {
  pulseT = Math.min(1, pulseT + 0.032);
  const p = pulseT;
  const r = Math.max(W,H)*p*1.0;
  const g = ctx.createRadialGradient(W/2,H/2,r*0.1,W/2,H/2,r);
  g.addColorStop(0, `rgba(255,255,220,${0.55*(1-p)})`);
  g.addColorStop(0.2, `rgba(255,100,20,${0.4*(1-p)})`);
  g.addColorStop(0.5, `rgba(255,30,0,${0.2*(1-p)})`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(W/2,H/2,r,0,6.28); ctx.fill();
}

function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms-(frame.last||ms))/1000);
  frame.last = ms; time = ms*0.001;

  if (mode==='jungle'||mode==='cooling') logoHeat *= 0.994;
  if (mode==='heating'||mode==='jungle') transition = Math.min(1, transition+dt*1.5);
  if (mode==='cooling') {
    transition = Math.max(0, transition-dt*0.6);
    logoHeat *= 0.95;
    if (transition<=0.02) {
      mode='clean'; clean.classList.remove('gone'); logo.classList.remove('hot');
      tag.classList.remove('thermal'); hint.classList.remove('thermal');
      hint.textContent='TAP 117'; logoHeat=0; drips.length=0;
      heatCtx.fillStyle='#000'; heatCtx.fillRect(0,0,heatMap.width,heatMap.height);
    }
  }

  updateHeat();

  if (mode==='clean') { ctx.fillStyle='#f4f3ef'; ctx.fillRect(0,0,W,H); return; }
  if (mode==='heating') {
    drawJungle(); drawPulse();
    ctx.fillStyle=`rgba(244,243,239,${Math.max(0,1-transition*1.4)})`;
    ctx.fillRect(0,0,W,H); return;
  }
  if (mode==='jungle'||mode==='cooling') {
    drawJungle();
    if (mode==='cooling') {
      ctx.fillStyle=`rgba(0,0,0,${1-transition})`; ctx.fillRect(0,0,W,H);
    }
  }
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
