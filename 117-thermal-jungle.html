<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>117 — THERMAL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#f4f3ef;touch-action:none}
  canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
  #clean{
    position:absolute;inset:0;display:grid;place-items:center;
    background:#f4f3ef;z-index:5;transition:opacity .4s ease;
  }
  #clean.gone{opacity:0;pointer-events:none}
  #clean .n{
    font:900 clamp(110px,30vw,260px)/0.85 Arial Black,Arial,sans-serif;
    letter-spacing:-0.07em;color:#0a0a0a;
    transition:color .18s,filter .28s,transform .28s;
    cursor:pointer;user-select:none;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.2));
  }
  #clean .n.hot{
    color:#fffef8;
    filter:drop-shadow(0 0 28px #fff) drop-shadow(0 0 70px #ff8a00) drop-shadow(0 0 110px #ff1a00);
    transform:scale(1.09);
  }
  .tag,.hint{
    position:fixed;bottom:max(14px,env(safe-area-inset-bottom));
    font:700 9px/1 Arial,sans-serif;letter-spacing:.16em;
    z-index:20;pointer-events:none;transition:color .5s;
  }
  .tag{left:16px;color:rgba(0,0,0,.28)}
  .hint{right:16px;color:rgba(0,0,0,.22)}
  .tag.thermal,.hint.thermal{color:rgba(140,200,255,.4)}
</style>
</head>
<body>
<div id="clean"><div class="n" id="logo">117</div></div>
<canvas id="c"></canvas>
<div class="tag" id="tag">117 / THERMAL</div>
<div class="hint" id="hint">TAP 117</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const clean = document.getElementById('clean');
const logo = document.getElementById('logo');
const tag = document.getElementById('tag');
const hint = document.getElementById('hint');

let W, H, D, time = 0;
let mode = 'clean';
let transition = 0, pulseT = 0, logoHeat = 0, exposure = 1, scanY = 0;
let heatMap, heatCtx;
let pointer = { x: 0.5, y: 0.5, down: false, px: 0.5, py: 0.5 };
const layers = [];
const drips = [];

function resize() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * D;
  H = canvas.height = innerHeight * D;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  const hw = Math.max(200, W >> 1), hh = Math.max(200, H >> 1);
  heatMap = document.createElement('canvas');
  heatMap.width = hw; heatMap.height = hh;
  heatCtx = heatMap.getContext('2d');
  heatCtx.fillStyle = '#000';
  heatCtx.fillRect(0, 0, hw, hh);
  buildWorld();
}
resize();
addEventListener('resize', resize);

function buildWorld() {
  layers.length = 0;
  for (let L = 0; L < 8; L++) {
    const depth = L / 7;
    const leaves = [];
    // Much denser foreground
    const n = 28 + Math.floor((1 - depth) * 48);
    for (let i = 0; i < n; i++) {
      // Bias more leaves toward bottom & sides for foreground framing
      let x = Math.random(), y = Math.random();
      if (depth < 0.35 && Math.random() < 0.45) {
        y = 0.55 + Math.random() * 0.45; // lower third heavy
      }
      leaves.push({
        x, y,
        w: 0.07 + Math.random() * 0.36,
        h: 0.05 + Math.random() * 0.26,
        rot: (Math.random() - 0.5) * 2,
        phase: Math.random() * 6.28,
        type: Math.floor(Math.random() * 5),
        base: 0.12 + Math.random() * 0.2 + (1 - depth) * 0.16
      });
    }
    const vines = [];
    if (depth < 0.8) {
      for (let v = 0; v < 5 + (Math.random() * 5 | 0); v++) {
        vines.push({
          x: Math.random(),
          len: 0.22 + Math.random() * 0.6,
          phase: Math.random() * 14,
          thick: 0.007 + Math.random() * 0.016
        });
      }
    }
    layers.push({ depth, leaves, vines });
  }
}

function setPos(e) {
  const t = e.touches ? e.touches[0] : e;
  pointer.px = pointer.x; pointer.py = pointer.y;
  pointer.x = t.clientX / innerWidth;
  pointer.y = t.clientY / innerHeight;
}
function onDown(e) {
  setPos(e); pointer.down = true;
  if (mode === 'clean') {
    mode = 'heating'; logo.classList.add('hot');
    logoHeat = 1; pulseT = 0; transition = 0;
    setTimeout(() => {
      mode = 'jungle';
      clean.classList.add('gone');
      tag.classList.add('thermal'); hint.classList.add('thermal');
      hint.textContent = 'TOUCH · HOLD TO EXIT';
    }, 480);
  } else if (mode === 'jungle') {
    const dx = pointer.x - 0.5, dy = pointer.y - 0.42;
    if (Math.hypot(dx, dy) < 0.24) logoHeat = Math.min(1, logoHeat + 0.95);
  }
}
function onUp() { pointer.down = false; }

let pressT = null;
function startHold() {
  clearTimeout(pressT);
  pressT = setTimeout(() => { if (mode === 'jungle' && pointer.down) mode = 'cooling'; }, 750);
}
function cancelHold() { clearTimeout(pressT); }

canvas.addEventListener('pointerdown', e => { onDown(e); startHold(); canvas.setPointerCapture?.(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (pointer.down) setPos(e); });
canvas.addEventListener('pointerup', () => { onUp(); cancelHold(); });
canvas.addEventListener('pointercancel', () => { onUp(); cancelHold(); });
logo.addEventListener('pointerdown', e => { e.stopPropagation(); onDown(e); startHold(); });

function updateHeat() {
  const hw = heatMap.width, hh = heatMap.height;
  heatCtx.fillStyle = 'rgba(0,0,0,0.034)';
  heatCtx.fillRect(0, 0, hw, hh);

  if (pointer.down && (mode === 'jungle' || mode === 'heating')) {
    const x = pointer.x * hw, y = pointer.y * hh;
    const px = pointer.px * hw, py = pointer.py * hh;
    const dist = Math.hypot(x - px, y - py);
    const s = Math.min(1.7, 0.55 + dist * 0.09);
    const g = heatCtx.createRadialGradient(x, y, 0, x, y, 26 * s);
    g.addColorStop(0, `rgba(255,255,255,${0.75*s})`);
    g.addColorStop(0.3, `rgba(255,130,15,${0.35*s})`);
    g.addColorStop(1, 'transparent');
    heatCtx.fillStyle = g;
    heatCtx.beginPath(); heatCtx.arc(x, y, 26*s, 0, 6.28); heatCtx.fill();
    if (dist > 1.5) {
      heatCtx.strokeStyle = `rgba(255,170,30,${0.35*s})`;
      heatCtx.lineWidth = 16 * s; heatCtx.lineCap = 'round';
      heatCtx.beginPath(); heatCtx.moveTo(px, py); heatCtx.lineTo(x, y); heatCtx.stroke();
    }
  }
  if (logoHeat > 0.04) {
    const g = heatCtx.createRadialGradient(hw/2, hh*0.42, 0, hw/2, hh*0.42, 40 + logoHeat*34);
    g.addColorStop(0, `rgba(255,255,255,${0.85*logoHeat})`);
    g.addColorStop(0.28, `rgba(255,80,0,${0.5*logoHeat})`);
    g.addColorStop(1, 'transparent');
    heatCtx.fillStyle = g;
    heatCtx.beginPath(); heatCtx.arc(hw/2, hh*0.42, 40+logoHeat*34, 0, 6.28); heatCtx.fill();
  }
}

function therm(t) {
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.08) { const k=t/0.08; r=0; g=0; b=15+k*40; }
  else if (t < 0.22) { const k=(t-0.08)/0.14; r=5; g=10+k*110; b=55+k*150; }
  else if (t < 0.4) { const k=(t-0.22)/0.18; r=15+k*40; g=120+k*90; b=200-k*50; }
  else if (t < 0.55) { const k=(t-0.4)/0.15; r=55+k*130; g=205-k*25; b=150-k*100; }
  else if (t < 0.72) { const k=(t-0.55)/0.17; r=185+k*60; g=180-k*90; b=50-k*30; }
  else if (t < 0.88) { const k=(t-0.72)/0.16; r=245+k*10; g=90-k*50; b=20-k*10; }
  else { const k=(t-0.88)/0.12; r=255; g=40+k*210; b=10+k*240; }
  return [r|0, g|0, b|0];
}

function drawLeaf(leaf, depth) {
  const par = (pointer.x-0.5)*60*depth*D;
  const parY = (pointer.y-0.5)*35*depth*D;
  const x = leaf.x*W + par, y = leaf.y*H + parY;
  const w = leaf.w*Math.min(W,H), h = leaf.h*Math.min(W,H);
  const sway = Math.sin(time*(1.15+depth)+leaf.phase)*0.11;

  let boost = 0;
  const d = Math.hypot(leaf.x-pointer.x, leaf.y-pointer.y);
  if (pointer.down && d < 0.22) boost = (0.22-d)/0.22;
  const ld = Math.hypot(leaf.x-0.5, leaf.y-0.42);
  if (ld < 0.32) boost = Math.max(boost, logoHeat*(1-ld/0.32)*0.85);

  const temp = leaf.base + boost*0.65 + Math.sin(time*2.1+leaf.phase)*0.03;
  const [r,g,b] = therm(temp);

  ctx.save();
  ctx.translate(x,y); ctx.rotate(leaf.rot+sway);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.beginPath();
  if (leaf.type === 0) ctx.ellipse(0,0,w*0.5,h*0.5,0,0,6.28);
  else if (leaf.type === 1) ctx.ellipse(0,0,w*0.58,h*0.38,0,0,6.28);
  else if (leaf.type === 2) {
    ctx.moveTo(0,-h*0.52); ctx.quadraticCurveTo(w*0.58,0,0,h*0.52); ctx.quadraticCurveTo(-w*0.58,0,0,-h*0.52);
  } else if (leaf.type === 3) {
    ctx.ellipse(-w*0.2,0,w*0.34,h*0.42,-0.4,0,6.28);
    ctx.ellipse(w*0.2,0,w*0.34,h*0.42,0.4,0,6.28);
  } else {
    for (let i=-2;i<=2;i++) ctx.ellipse(i*w*0.13, Math.abs(i)*h*0.09, w*0.22, h*0.48, i*0.28, 0, 6.28);
  }
  ctx.fill();
  const [vr,vg,vb] = therm(temp*0.68);
  ctx.strokeStyle = `rgba(${vr},${vg},${vb},0.4)`;
  ctx.lineWidth = 1.15*D;
  ctx.beginPath(); ctx.moveTo(0,-h*0.38); ctx.lineTo(0,h*0.38); ctx.stroke();
  ctx.restore();
}

function drawVine(v, depth) {
  const par = (pointer.x-0.5)*45*depth*D;
  const x = v.x*W + par;
  const top = (0.01+Math.sin(time*0.3+v.phase)*0.025)*H;
  const len = v.len*H;
  const [r,g,b] = therm(0.16+depth*0.14);
  ctx.strokeStyle = `rgb(${r},${g},${b})`;
  ctx.lineWidth = v.thick*Math.min(W,H);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.quadraticCurveTo(x+Math.sin(time*0.55+v.phase)*22*D, top+len*0.5, x+Math.sin(v.phase)*14*D, top+len);
  ctx.stroke();
}

function spawnDrips() {
  if (logoHeat < 0.2) return;
  // More drips when hotter
  const rate = 0.35 + logoHeat * 0.5;
  if (Math.random() > rate) return;
  const count = 1 + (Math.random() < logoHeat * 0.7 ? 1 : 0) + (Math.random() < logoHeat * 0.4 ? 1 : 0);
  for (let i = 0; i < count; i++) {
    // Drip from bottom of each digit roughly
    const digit = Math.floor(Math.random() * 3);
    const baseX = 0.32 + digit * 0.18 + (Math.random() - 0.5) * 0.08;
    drips.push({
      x: baseX,
      y: 0.50 + Math.random() * 0.06,
      vy: 0.3 + Math.random() * 1.4,
      life: 1,
      w: 1.2 + Math.random() * 3.2,
      heat: 0.75 + Math.random() * 0.25
    });
  }
}

function drawMolten117() {
  const pulse = 1 + Math.sin(time * 5.2) * 0.045 * Math.max(0.3, logoHeat);
  const fs = Math.min(W, H) * 0.22 * pulse;
  ctx.save();
  ctx.translate(W / 2, H * 0.40);

  // Strong cyan-blue heat rim (like reference)
  if (logoHeat > 0.08) {
    const aura = ctx.createRadialGradient(0, 0, fs * 0.25, 0, 0, fs * 1.7);
    aura.addColorStop(0, `rgba(255,220,100,${0.3 * logoHeat})`);
    aura.addColorStop(0.35, `rgba(0,190,255,${0.28 * logoHeat})`);
    aura.addColorStop(0.7, `rgba(0,80,200,${0.1 * logoHeat})`);
    aura.addColorStop(1, 'transparent');
    ctx.fillStyle = aura;
    ctx.beginPath(); ctx.arc(0, 0, fs * 1.7, 0, 6.28); ctx.fill();
  }

  ctx.font = `900 ${fs}px Arial Black, Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // Molten fill
  const [cr, cg, cb] = therm(0.78 + logoHeat * 0.22);
  ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
  ctx.shadowColor = `rgba(255,${50 + logoHeat * 200},0,${0.75 * logoHeat})`;
  ctx.shadowBlur = 42 * D * logoHeat;
  ctx.fillText('117', 0, 0);
  ctx.shadowBlur = 0;

  // White-hot core + chromatic fringes
  if (logoHeat > 0.25) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,255,240,${0.4 * logoHeat})`;
    ctx.fillText('117', 0, 0);
    ctx.fillStyle = `rgba(0,210,255,${0.15 * logoHeat})`;
    ctx.fillText('117', -2 * D, 1 * D);
    ctx.fillStyle = `rgba(255,30,0,${0.15 * logoHeat})`;
    ctx.fillText('117', 2 * D, -1 * D);
    ctx.globalCompositeOperation = 'source-over';
  }

  ctx.restore();

  // Heavy drips
  spawnDrips();
  for (let i = drips.length - 1; i >= 0; i--) {
    const d = drips[i];
    d.y += d.vy * 0.009;
    d.vy += 0.09;
    d.life -= 0.01;
    if (d.life <= 0 || d.y > 1.15) { drips.splice(i, 1); continue; }
    const [dr, dg, db] = therm(d.heat * d.life + 0.15);
    const alpha = d.life * 0.95;
    // elongated drip
    ctx.fillStyle = `rgba(${dr},${dg},${db},${alpha})`;
    ctx.beginPath();
    ctx.ellipse(d.x * W, d.y * H, d.w * D, d.w * 2.8 * D, 0, 0, 6.28);
    ctx.fill();
    // bright tip
    if (d.life > 0.5) {
      ctx.fillStyle = `rgba(255,255,200,${(d.life - 0.5) * 0.6})`;
      ctx.beginPath();
      ctx.arc(d.x * W, d.y * H + d.w * 1.5 * D, d.w * 0.5 * D, 0, 6.28);
      ctx.fill();
    }
  }
}

function drawJungle() {
  ctx.fillStyle = '#00040c';
  ctx.fillRect(0, 0, W, H);

  // Vertical cool light shafts
  for (let i = 0; i < 6; i++) {
    const sx = (0.12 + i * 0.15 + Math.sin(time * 0.25 + i) * 0.03) * W;
    const grd = ctx.createLinearGradient(sx, 0, sx, H);
    grd.addColorStop(0, 'rgba(0,130,210,0.07)');
    grd.addColorStop(0.45, 'rgba(0,70,140,0.03)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(sx - 50 * D, 0, 100 * D, H);
  }

  for (let Li = layers.length - 1; Li >= 0; Li--) {
    const layer = layers[Li];
    if (layer.depth > 0.18) {
      ctx.fillStyle = `rgba(0,8,28,${0.05 + layer.depth * 0.11})`;
      ctx.fillRect(0, 0, W, H);
    }
    for (const v of layer.vines) drawVine(v, layer.depth);
    for (const leaf of layer.leaves) drawLeaf(leaf, layer.depth);
  }

  drawMolten117();

  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(heatMap, 0, 0, W, H);
  ctx.restore();

  // Sensor
  scanY = (scanY + 2.2 * D) % H;
  ctx.fillStyle = 'rgba(140,200,255,0.028)';
  ctx.fillRect(0, scanY, W, 2.2 * D);
  if (Math.random() < 0.5) {
    ctx.fillStyle = 'rgba(255,255,255,0.011)';
    for (let i = 0; i < 40; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 1.3 * D, 1.3 * D);
  }
  if (Math.random() < 0.007) exposure = 0.55 + Math.random() * 0.75;
  exposure += (1 - exposure) * 0.04;
  if (Math.abs(exposure - 1) > 0.03) {
    ctx.fillStyle = `rgba(0,0,0,${(1 - exposure) * 0.22})`;
    ctx.fillRect(0, 0, W, H);
  }
  const vig = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.68);
  vig.addColorStop(0.5, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,12,0.58)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawPulse() {
  pulseT = Math.min(1, pulseT + 0.034);
  const p = pulseT;
  const r = Math.max(W, H) * p * 1.05;
  const g = ctx.createRadialGradient(W/2, H/2, r * 0.08, W/2, H/2, r);
  g.addColorStop(0, `rgba(255,255,230,${0.6*(1-p)})`);
  g.addColorStop(0.18, `rgba(255,90,15,${0.42*(1-p)})`);
  g.addColorStop(0.45, `rgba(255,20,0,${0.2*(1-p)})`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, 6.28); ctx.fill();
}

function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - (frame.last || ms)) / 1000);
  frame.last = ms; time = ms * 0.001;

  if (mode === 'jungle' || mode === 'cooling') logoHeat *= 0.995;
  if (mode === 'heating' || mode === 'jungle') transition = Math.min(1, transition + dt * 1.55);
  if (mode === 'cooling') {
    transition = Math.max(0, transition - dt * 0.55);
    logoHeat *= 0.94;
    if (transition <= 0.02) {
      mode = 'clean'; clean.classList.remove('gone'); logo.classList.remove('hot');
      tag.classList.remove('thermal'); hint.classList.remove('thermal');
      hint.textContent = 'TAP 117'; logoHeat = 0; drips.length = 0;
      heatCtx.fillStyle = '#000'; heatCtx.fillRect(0, 0, heatMap.width, heatMap.height);
    }
  }

  updateHeat();

  if (mode === 'clean') { ctx.fillStyle = '#f4f3ef'; ctx.fillRect(0, 0, W, H); return; }
  if (mode === 'heating') {
    drawJungle(); drawPulse();
    ctx.fillStyle = `rgba(244,243,239,${Math.max(0, 1 - transition * 1.45)})`;
    ctx.fillRect(0, 0, W, H); return;
  }
  if (mode === 'jungle' || mode === 'cooling') {
    drawJungle();
    if (mode === 'cooling') {
      ctx.fillStyle = `rgba(0,0,0,${1 - transition})`; ctx.fillRect(0, 0, W, H);
    }
  }
}
requestAnimationFrame(frame);
</script>
<script src="117-audio.js"></script>
</body>
</html>
